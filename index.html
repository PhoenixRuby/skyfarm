/* ===== 10. v1.5: moving things, house/tower as buildings, drone pad & robot charger, roaming animals ===== */
const AU = CFG.automationUnits || { water: { base: 'drone_pad', workMinutes: 15, kwhPerCharge: .1, tankDrops: 60, refillSeconds: 30 }, feed: { base: 'robot_charger', workMinutes: 20, kwhPerCharge: .15 }, chargeSources: { solar: { clearDayMinutes: 20, cloudyMinutes: 40 }, farm: { minutes: 5 } } };
const MOVE = CFG.move || { longPressMs: 400, slopPx: 6 };
const ROAM = CFG.animalRoam || { tilesPerSecond: .35, pauseSeconds: [2,6] };
const UNIT_NAME = { water: '無人機', feed: '機器人' };
const BASE_OF = { water: AU.water.base, feed: AU.feed.base };

/* ---------- generic objects on the map ---------- */
function houseCells(M, T){ const out = []; for (let dy=0; dy<2; dy++) for (let dx=0; dx<2; dx++) out.push(tkey(T.rx+dx, T.ry+dy)); return out; }
function compOf(M, k, pred){ const seen = new Set([k]), st = [k];
  while (st.length){ const c = st.pop(), [x,y] = pkey(c); for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = tkey(x+dx,y+dy); if (!seen.has(n) && pred(M.tiles[n])){ seen.add(n); st.push(n); } } }
  return [...seen]; }
// describe the movable object covering tile k, or null
function objectAt(M, k){
  const T = M.tiles[k]; if (!T) return null;
  let cells = [k], kind = T.t, bid = null;
  switch (T.t){
    case 'house': cells = houseCells(M, T); bid = 'farmhouse'; break;
    case 'tower': bid = 'water_tower'; break;
    case 'building': { const [w,h] = bldSize(T.id); cells = []; for (let dy=0; dy<h; dy++) for (let dx=0; dx<w; dx++) cells.push(tkey(T.rx+dx, T.ry+dy)); bid = T.id; break; }
    case 'pool': cells = compOf(M, k, isPool); break;
    case 'deco': if (T.id === 'pond') cells = compOf(M, k, isPond); break;
    case 'doll': case 'device': case 'machine': case 'animal': break;
    default: return null;   // soil, tree, weed
  }
  const xs = cells.map(c => pkey(c)[0]), ys = cells.map(c => pkey(c)[1]);
  return { kind, bid, cells, ax: Math.min(...xs), ay: Math.min(...ys) };
}
function objName(M, k){ const T = M.tiles[k]; if (!T) return ''; if (T.t === 'house') return '農舍'; if (T.t === 'tower') return '農場水塔'; if (T.t === 'building') return BLD[T.id].name;
  if (T.t === 'pool') return '魚池'; if (T.t === 'doll'){ const d = dollById(T.did); return d ? DOLL.types[d.type].name : '娃娃'; } return nameOf(T.id) || ''; }

/* ---------- moving ---------- */
RT.mv = null;
function startMove(M, k, gx, gy, via){
  const o = objectAt(M, k);
  if (!o){ const T = M.tiles[k]; toast(!T ? '這裡沒有東西可以搬' : T.t === 'soil' || T.t === 'tree' ? '田和果樹不能搬，只能剷除後重新開墾' : '這個不能搬'); return false; }
  RT.mv = { mi: S.cur, o, gx, gy, tx: gx, ty: gy, via, name: objName(M, k) };
  if (via === 'tool') toast(`拿起${RT.mv.name}，點空地放下（Esc 取消）`);
  updateHint(); return true;
}
function moveOffset(){ const m = RT.mv; return m ? { dx: m.tx - m.gx, dy: m.ty - m.gy } : { dx: 0, dy: 0 }; }
function moveTargets(){ const m = RT.mv, { dx, dy } = moveOffset(); return m.o.cells.map(c => { const [x,y] = pkey(c); return [c, tkey(x+dx, y+dy), x+dx, y+dy]; }); }
function moveCheck(){
  const m = RT.mv; if (!m) return { ok: false };
  const M = S.maps[m.mi], own = new Set(m.o.cells);
  for (const [, nk, x, y] of moveTargets()){
    if (!inMap(M, x, y)) return { ok: false, why: '超出地圖了' };
    const U = M.tiles[nk]; if (U && !own.has(nk) && U.t !== 'weed') return { ok: false, why: '那裡已經有東西了' };
  }
  return { ok: true };
}
function cancelMove(silent){ if (!RT.mv) return; RT.mv = null; if (!silent) toast('已取消搬移'); updateHint(); }
function dropMove(){
  const m = RT.mv; if (!m) return;
  const { dx, dy } = moveOffset();
  if (!dx && !dy){ RT.mv = null; updateHint(); return; }
  const c = moveCheck(); if (!c.ok){ toast(`${c.why}，${m.name}放回原位`); RT.mv = null; updateHint(); return; }
  const M = S.maps[m.mi], pairs = moveTargets(), own = new Set(m.o.cells);
  for (const [, nk, x, y] of pairs){ const U = M.tiles[nk]; if (U && U.t === 'weed' && !own.has(nk)){ const { cx, cy } = center(x,y); pullWeed(M, nk, cx, cy); } }
  // carry pool data
  let poolData = null; if (m.o.kind === 'pool'){ const pk = poolOf(M, m.o.cells[0]); if (pk){ const P = M.pools[pk]; poolData = { fish: P.fish, stage: P.stage, timer: P.timer }; } }
  const objs = pairs.map(([ok]) => M.tiles[ok]);
  for (const [ok] of pairs) delete M.tiles[ok];
  pairs.forEach(([, nk], i) => { const T = objs[i]; if (T.rx !== undefined){ T.rx += dx; T.ry += dy; } M.tiles[nk] = T; });
  if (m.o.kind === 'pool'){ reconcilePools(M); const pk = poolOf(M, pairs[0][1]); if (pk && poolData) Object.assign(M.pools[pk], poolData); }
  if (m.o.kind === 'animal'){ const ag = RT.agents[`${m.mi}:${pairs[0][0]}`]; delete RT.agents[`${m.mi}:${pairs[0][0]}`]; }
  RT.decoVer++; RT.regionsAt = 0; RT.mv = null;
  const { cx, cy } = center(pairs[0][2], pairs[0][3]); floatText(cx, cy - 24, `搬好${m.name}`, '#2f7fa8', 11);
  afterAction(); UIbuildTray();
}
function moveToolClick(M, x, y){
  if (RT.mv){ const T = M.tiles[tkey(x,y)]; if (T && T.t === 'building' && (T.id === 'barn' || T.id === 'shed') && !RT.mv.o.cells.includes(tkey(x,y))){ storeMoved(); return; }
    RT.mv.tx = x; RT.mv.ty = y; dropMove(); return; }

}
function drawMoveGhost(){
  const m = RT.mv; if (!m || m.mi !== S.cur) return;
  const ok = moveCheck().ok;
  for (const [, , x, y] of moveTargets()){ const { cx, cy } = center(x,y);
    ctx.fillStyle = ok ? 'rgba(90,200,110,.35)' : 'rgba(230,80,60,.35)'; ctx.strokeStyle = ok ? '#3e9a52' : '#c5452f'; ctx.lineWidth = 2; diamondPath(cx, cy, .96); ctx.fill(); ctx.stroke(); }
}
// world-space lift for a tile that is being carried
function liftOf(k){
  const m = RT.mv; if (!m || m.mi !== S.cur || !m.o.cells.includes(k)) return null;
  const { dx, dy } = moveOffset(); return { x: (dx - dy) * HW, y: (dx + dy) * HH - 8 };
}

/* ---------- house / tower / pads as buildings ---------- */
function housePos(M){ for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'house' && T.rx !== undefined){ const c = center(T.rx, T.ry); return { x: c.cx, y: c.cy + HH, rx: T.rx, ry: T.ry }; } } return null; }
function drawHouse(T, x, y, now){
  if (x !== T.rx + 1 || y !== T.ry + 1) return;
  const c = center(T.rx, T.ry), hx = c.cx, hy = c.cy + HH, ph = dayPhase(now);
  spr(ph.light < 0.5 ? 'building_farmhouse_night' : 'building_farmhouse_idle', 0, hx, hy);
  spr(S.settings.grid ? 'utility_pole_on' : 'utility_pole_off', 0, hx - 58, hy + 2);
}
function findBase(id){ for (let mi = 0; mi < S.maps.length; mi++){ const M = S.maps[mi]; for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'building' && T.id === id) return { mi, k, T, M }; } } return null; }
const baseOwned = id => !!findBase(id) || (S.buildStore[id] || 0) > 0;
function nearestFree(M, ax, ay){
  let best = null, bd = Infinity;
  for (const [bx,by] of M.blocks) for (let y=by*BS; y<by*BS+BS; y++) for (let x=bx*BS; x<bx*BS+BS; x++){
    const T = M.tiles[tkey(x,y)]; if (T && T.t !== 'weed') continue; const d = Math.abs(x-ax) + Math.abs(y-ay); if (d < bd){ bd = d; best = [x,y]; } }
  return best;
}
// place a building from storage (or freshly bought) at x,y. returns true if placed
function placeAny(M, x, y, id, cx, cy, fromStore = true){
  const [w,h] = bldSize(id), cells = [];
  for (let dy=0; dy<h; dy++) for (let dx=0; dx<w; dx++){ const xx = x+dx, yy = y+dy; const U = M.tiles[tkey(xx,yy)];
    if (!inMap(M, xx, yy) || (U && U.t !== 'weed')){ toast(`${BLD[id].name}要 ${w}×${h} 格空草地（從點的格子往右下）`); return false; } cells.push(tkey(xx,yy)); }
  for (const k of cells) if (M.tiles[k]){ const [xx,yy] = pkey(k), c = center(xx,yy); pullWeed(M, k, c.cx, c.cy); }
  for (const k of cells) M.tiles[k] = id === 'farmhouse' ? { t: 'house', rx: x, ry: y } : id === 'water_tower' ? { t: 'tower' } : { t: 'building', id, rx: x, ry: y, src: BLD[id].chargeSourceDefault || undefined };
  if (fromStore) S.buildStore[id]--;
  floatText(cx, cy - 24, `放好${BLD[id].name}`, '#2f7fa8', 11); RT.decoVer++; RT.regionsAt = 0; return true;
}
function storeObject(M, k){
  const o = objectAt(M, k); if (!o || !o.bid) return false;
  for (const c of o.cells) delete M.tiles[c];
  S.buildStore[o.bid] = (S.buildStore[o.bid] || 0) + 1; RT.decoVer++; RT.regionsAt = 0;
  toast(o.bid === 'water_tower' ? '水塔收進倉庫了：水量和接水照常，只是看不到' : o.bid === 'farmhouse' ? '農舍收進倉庫了，之後用「裝飾」工具拿出來擺' : `${BLD[o.bid].name}收回飾品倉庫了，可以再拿出來擺`);
  return true;
}
function sellBase(M, k){
  const T = M.tiles[k], B = BLD[T.id], back = Math.floor((B.cost || 0) * (B.sellRate || .5));
  delete M.tiles[k]; S.player.coins += back; const [x,y] = pkey(k), c = center(x,y); flyCoins(worldToScreen(c.cx, c.cy - 20), back);
  floatText(c.cx, c.cy - 24, `賣掉 +${fmtN(back)}`, '#c98a0c', 12);
  const kind = T.id === BASE_OF.water ? 'water' : 'feed'; if (S.units[kind]){ S.units[kind].batt = 0; if (kind === 'water') S.units.water.tank = 0; }
}

/* ---------- drone / robot units ---------- */
const unitActive = (kind, t) => t < (kind === 'water' ? S.automation.waterUntil : S.automation.feedUntil);
const workSec = kind => AU[kind].workMinutes * 60;
function newUnit(kind){ return { state: 'off', batt: workSec(kind), tank: kind === 'water' ? AU.water.tankDrops : 0, charge: 0, refill: 0 }; }
function drawFarmPower(kwh, t){
  const P = S.power, order = POW.priorityOrder[S.settings.powerPriority === 'grid' ? 'grid' : 'battery'];
  const avail = { battery: P.battery, crankBuffer: P.crank, generator: 0, grid: gridOn() ? Infinity : 0 };
  if (order.reduce((a,s) => a + avail[s], 0) < kwh - 1e-12) return false;
  let need = kwh; const night = isNightAt(t), price = elecPrice(t);
  for (const s of order){ if (need <= 1e-12) break; const n = Math.min(need, avail[s]); if (n <= 0) continue;
    if (s === 'battery') P.battery -= n; else if (s === 'crankBuffer') P.crank -= n; else if (s === 'grid'){ S.bill.cur.elecKwh[night ? 'night' : 'day'] += n; S.bill.cur.elecCost += n * price; }
    need -= n; }
  return true;
}
function chargeStep(kind, base, dt, t){ // returns fraction added
  const cs = AU.chargeSources, src = base.T.src || 'solar';
  if (src === 'solar'){ if (isNightAt(t)) return 0; return dt / ((farmCloudy(t) || farmRain(t) ? cs.solar.cloudyMinutes : cs.solar.clearDayMinutes) * 60); }
  const frac = dt / (cs.farm.minutes * 60);
  return drawFarmPower(AU[kind].kwhPerCharge * frac, t) ? frac : 0;
}
// advance one unit; returns true when it is doing its job during this step
function stepUnit(kind, dt, t){
  const U = S.units[kind], base = findBase(BASE_OF[kind]), water = kind === 'water';
  const empty = () => U.batt <= 0 || (water && U.tank <= 0);
  if (!unitActive(kind, t)){
    if (base && (U.batt < workSec(kind))){ U.charge += chargeStep(kind, base, dt, t); if (U.charge >= 1){ U.charge = 0; U.batt = workSec(kind); } }
    if (base && water && U.tank < AU.water.tankDrops && useWater(AU.water.tankDrops - U.tank, true, t)){ useWater(AU.water.tankDrops - U.tank, false, t); U.tank = AU.water.tankDrops; }
    U.state = 'off'; return false;
  }
  if (U.state === 'off') U.state = empty() ? (base ? (U.batt <= 0 ? 'charge' : 'refill') : 'rest') : 'work';
  switch (U.state){
    case 'work':
      if (empty()){ U.state = base ? (U.batt <= 0 ? 'charge' : 'refill') : 'rest'; return false; }
      U.batt -= dt; return true;
    case 'rest':
      if (base) U.state = U.batt <= 0 ? 'charge' : (water && U.tank <= 0 ? 'refill' : 'work');
      return false;
    case 'charge':
      if (!base){ U.state = empty() ? 'rest' : 'work'; return false; }
      U.charge += chargeStep(kind, base, dt, t);
      if (U.charge >= 1){ U.charge = 0; U.batt = workSec(kind); U.state = water && U.tank < AU.water.tankDrops ? 'refill' : 'work'; U.refill = 0; }
      return false;
    case 'refill':
      if (!base){ U.state = empty() ? 'rest' : 'work'; return false; }
      U.refill += dt;
      if (U.refill >= AU.water.refillSeconds){ const need = AU.water.tankDrops - U.tank;
        if (need <= 0 || useWater(need, false, t)){ U.tank = AU.water.tankDrops; U.refill = 0; U.state = U.batt <= 0 ? 'charge' : 'work'; }
        else U.refill = AU.water.refillSeconds; }   // wait for water
      return false;
  }
  return false;

/* ===== 15. v1.8: robots can be owned (battery) or rented (hours); snow robot; sweeper ===== */
const RB = CFG.robots || null;
const KINDS = ['water','feed','snow','sweep'];
const RK = kind => RB.kinds[kind];
const R_ICON = { water: 'ui_drone_pad', feed: 'ui_robot_charger', snow: 'ui_snowbot', sweep: 'ui_sweeper' };
BASE_OF.snow = 'robot_charger'; BASE_OF.sweep = 'sweeper_dock';
UNIT_NAME.snow = '除雪機器人'; UNIT_NAME.sweep = '掃地機器人';
if (BLD.sweeper_dock){ BLD.sweeper_dock.serves = 'sweep'; BLD.sweeper_dock.chargeSourceDefault = BLD.sweeper_dock.chargeSourceDefault || 'solar'; }
const KIND_NAME = kind => RK(kind).name;
const rentKey = kind => kind + 'Until';
const rentActive = (kind, t) => t < (S.automation[rentKey(kind)] || 0);
const tierOf = kind => { const U = S.robots[kind]; return U && U.tier >= 0 ? RK(kind).tiers[U.tier] : null; };
const robotWorkSec = kind => { const tr = tierOf(kind); return tr ? tr.workHours * 3600 : 1; };
const fmtHours = h => h >= 1 ? `${+h.toFixed(1)} 小時` : `${Math.round(h*60)} 分鐘`;
const SNOWBOT_TPM = 10;
function rentOptions(kind){
  if (kind === 'water' || kind === 'feed') return Object.entries(CFG.automation).filter(([,a]) => a.kind === kind).map(([id,a]) => ({ id, name: a.name, hours: a.hours, cost: a.cost, unlock: id }));
  return (RK(kind).rent || []).map((r,i) => ({ id: `rent_${kind}_${i}`, name: RK(kind).name, hours: r.hours, cost: r.cost, unlock: RK(kind).tiers[0].id }));
}

/* ---------- buy / upgrade / rent ---------- */
function buyRobot(kind, ti){
  const K = RK(kind), tier = K.tiers[ti], U = S.robots[kind];
  if (!isUnlocked(tier.id)){ toast(`${tier.name}${K.name}要到第 ${UNLOCK[tier.id]} 級才解鎖`); return false; }
  if (kind !== 'sweep' && !baseOwned(K.base)){ toast(`要先用「建設」蓋${BLD[K.base].name}，才能買${K.name}`); return false; }
  if (U.tier >= ti){ toast('已經有這一級或更好的了'); return false; }
  const trade = U.tier >= 0 ? Math.floor(K.tiers[U.tier].buy * (RB.upgradeTradeInRate || .5)) : 0, price = tier.buy - trade;
  if (!spend(price)) return false;
  U.tier = ti; U.batt = tier.workHours * 3600; U.tank = K.tankDrops || 0; U.state = 'idle'; U.refill = 0; U.on = true;
  if (kind === 'sweep' && !baseOwned('sweeper_dock')){ S.buildStore.sweeper_dock = (S.buildStore.sweeper_dock || 0) + 1; toast('掃地機器人買好了！基座在飾品倉庫，用「裝飾」工具拿出來擺，它才能回家充電', true, 4200); }
  else toast(trade ? `升級成${tier.name}${K.name}，舊的折價 ${fmtN(trade)} 金幣` : `買了${tier.name === '標準' ? '' : tier.name}${K.name}，充滿電可以工作 ${fmtHours(tier.workHours)}`, true, 3400);
  sfx('coin'); afterAction(); UIbuildTray(); return true;
}
function rentRobot(kind, opt){
  const K = RK(kind);
  if (!isUnlocked(opt.unlock)){ toast(`租${K.name}要到第 ${UNLOCK[opt.unlock]} 級`); return false; }
  const key = rentKey(kind), base = Math.max(Date.now(), S.automation[key] || 0), cap = Date.now() + R.autoMaxHours*3600e3;
  if (base >= cap - 60e3){ toast(`已經租到最長 ${R.autoMaxHours} 小時了`); return false; }
  if (!spend(opt.cost)) return false;
  S.automation[key] = Math.min(cap, base + opt.hours*3600e3); sfx('coin'); afterAction();
  toast(`租了${K.name} ${opt.hours} 小時，不用充電，時間到就離開${tierOf(kind) ? '；這段時間你自己的會回去充電' : ''}`, true, 3600); return true;
}
function buyAuto(id){ for (const kind of KINDS){ const o = rentOptions(kind).find(o => o.id === id); if (o) return rentRobot(kind, o); } return false; }

/* ---------- jobs ---------- */
function needsWater(){ for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if ((T.t === 'soil' || T.t === 'tree') && T.m < R.moistMaxLevel - 1e-6) return true; } return false; }
function hasFeedables(){ for (const M of S.maps){ for (const k in M.tiles) if (M.tiles[k].t === 'animal') return true; for (const pk in M.pools) if (M.pools[pk].fish) return true; } return false; }
const isTrash = T => !!T && (T.t === 'weed' || T.t === 'debris' || T.t === 'weedball');
const sweepable = T => !T || isTrash(T) || isRoadTile(T);
function sweepMapIndex(){ const b = findBase('sweeper_dock'); return b ? b.mi : 0; }
function sweepTargets(){ const M = S.maps[sweepMapIndex()]; for (const k in M.tiles) if (isTrash(M.tiles[k])) return true; return false; }
const robotJob = {
  water: (t, rainNow) => !rainNow && !tornadoNow(t) && needsWater(),
  feed: () => hasFeedables(),
  snow: () => S.snow.cover && snowLeftAny() > 0,
  sweep: () => sweepTargets(),
};

/* ---------- owned robot: battery, charging, shared charger queue ---------- */
function dequeue(kind){ const i = S.chargeQ.indexOf(kind); if (i >= 0) S.chargeQ.splice(i, 1); }
function chargerTurn(kind, base){ if (base.T.id !== 'robot_charger' && base.T.id !== 'drone_pad') return true; if (!S.chargeQ.includes(kind)) S.chargeQ.push(kind); return S.chargeQ.filter(x => BASE_OF[x] === base.T.id)[0] === kind; }
function chargeFrac(tier, base, dt, t){
  const src = base.T.src || 'solar', sec = tier.chargeHours * 3600;
  if (src === 'solar'){ if (isNightAt(t)) return 0; return dt / (sec * (RB.solarChargeMultiplier || 2)); }
  const f = dt / sec; return drawFarmPower(tier.kwh * f, t) ? f : 0;
}
function stepOwned(kind, dt, t, wantWork){
  const U = S.robots[kind], tier = tierOf(kind);
  if (!tier){ U.state = 'none'; dequeue(kind); return false; }
  const K = RK(kind), base = findBase(K.base), full = tier.workHours * 3600, water = kind === 'water', tankMax = K.tankDrops || 0;
  if (U.on === false) wantWork = false;
  U.waitWater = false;
  if (base){
    if (U.batt < full - 1e-6 && (U.batt <= 0 || !wantWork || U.state === 'charge' || U.state === 'queue')){
      if (!chargerTurn(kind, base)){ U.state = 'queue'; return false; }
      const f = chargeFrac(tier, base, dt, t);
      if (f > 0 || U.batt <= 0 || !wantWork){
        U.state = 'charge'; U.batt = Math.min(full, U.batt + f * full);
        if (U.batt >= full - 1e-6){ U.batt = full; dequeue(kind); U.state = 'idle'; }
        return false;
      }
      dequeue(kind);   // can't charge right now (night, no power) but still has some battery: go to work
    } else dequeue(kind);
    if (water && U.tank < tankMax && (U.tank <= 0 || !wantWork || U.state === 'refill')){
      U.state = 'refill'; U.refill = (U.refill || 0) + dt;
      if (U.refill >= AU.water.refillSeconds){
        if (useWater(tankMax - U.tank, false, t)){ U.tank = tankMax; U.refill = 0; U.state = 'idle'; }
        else { U.refill = AU.water.refillSeconds; U.waitWater = true; if (U.tank <= 0 || !wantWork) return false; U.refill = 0; }
      } else return false;
    }
  } else {
    dequeue(kind);
    if (U.batt <= 0 || (water && U.tank <= 0)){ U.state = 'rest'; return false; }
  }
  if (!wantWork){ U.state = 'idle'; return false; }
  U.state = 'work'; U.batt = Math.max(0, U.batt - dt); return true;
}
// owned drone waters from its own tank
function droneWater(dt, t){
  const U = S.robots.water, per = WAT.droneDropsPerLevel || 1;
  for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k];
    if ((T.t === 'soil' || T.t === 'tree') && T.m < R.moistMaxLevel){ const need = (R.moistMaxLevel - T.m) * per;
      if (U.tank < need){ U.tank = 0; return; } U.tank -= need; T.m = R.moistMaxLevel; T.dry = 0; if (T.crop) T.crop.wither = false; } }
}
function snowbotStep(dt){
  const W2 = S.robots.snow; W2.acc = (W2.acc || 0) + dt * SNOWBOT_TPM / 60;
  while (W2.acc >= 1){ W2.acc -= 1; let done = false;
    for (let mi = 0; mi < S.maps.length && !done; mi++) for (const [x,y] of mapTiles(S.maps[mi])){ const k = tkey(x,y); if (snowyAt(mi, k)){ (S.snow.cleared[mi] = S.snow.cleared[mi] || {})[k] = 1; RT.snowBot = { mi, x, y }; done = true; break; } }
    if (!done){ W2.acc = 0; break; } }
}
const sweepPathCache = { key: '', list: [] };
function sweepPath(mi){
  const M = S.maps[mi], key = mi + '|' + RT.decoVer + '|' + Object.keys(M.tiles).length + '|' + M.blocks.length;
  if (sweepPathCache.key === key) return sweepPathCache.list;
  const tl = mapTiles(M).filter(([x,y]) => sweepable(M.tiles[tkey(x,y)]));
  tl.sort((a,b) => a[1] - b[1] || (a[1] % 2 ? b[0] - a[0] : a[0] - b[0]));
  sweepPathCache.key = key; sweepPathCache.list = tl.map(([x,y]) => tkey(x,y)); return sweepPathCache.list;
}
function sweepStep(dt, t){
  const SW = S.sweep, dk = dayKeyLocal(t); if (SW.day !== dk){ SW.day = dk; SW.todayWeeds = 0; SW.todayTrash = 0; }
  const mi = sweepMapIndex(), M = S.maps[mi], path = sweepPath(mi); if (!path.length) return;
  SW.acc = (SW.acc || 0) + dt * (RK('sweep').tilesPerMinute || 15) / 60;
  const live = Date.now() - t < 5000 && mi === S.cur;
  while (SW.acc >= 1){ SW.acc -= 1; SW.idx = ((SW.idx || 0) + 1) % path.length; const k = path[SW.idx];
    const h = SW.heat[mi] || (SW.heat[mi] = {}), e = h[k], v = e ? e[0] * Math.exp(-(t - e[1]) / 86400e3) : 0; h[k] = [Math.round((v + 1) * 100) / 100, Math.round(t)];
    const T = M.tiles[k]; if (!isTrash(T)) continue;
    const [x,y] = pkey(k), c = center(x,y);
    if (T.t === 'weed'){ delete M.tiles[k]; collectWeeds(1, live ? c.cx : undefined, c.cy); SW.todayWeeds++; SW.totalWeeds++; }
    else if (T.t === 'weedball'){ delete M.tiles[k]; collectWeeds(T.n, live ? c.cx : undefined, c.cy); SW.todayWeeds += T.n; SW.totalWeeds += T.n; SW.todayTrash++; SW.totalTrash++; }
    else { delete M.tiles[k]; SW.todayTrash++; SW.totalTrash++; if (live) floatText(c.cx, c.cy - 18, '掃掉垃圾', '#6b5a48', 10); }
    RT.regionsAt = 0;
  }
  if (Math.random() < .01){ const lim = t - 86400e3; for (const m in SW.heat) for (const k in SW.heat[m]) if (SW.heat[m][k][1] < lim) delete SW.heat[m][k]; }
}
function stepRobots(dt, t, rainNow){
  const res = {};
  RT.jobs = RT.jobs || {};
  for (const kind of KINDS){
    const job = robotJob[kind](t, rainNow), rent = rentActive(kind, t);
    const until = S.automation[rentKey(kind)] || 0; S.rentSeen = S.rentSeen || {};
    if (!rent && until > 0 && S.rentSeen[kind] !== until){ S.rentSeen[kind] = until; if (t - until < 90e3) RT.notices.push({ kind: 'rentEnd', name: KIND_NAME(kind), icon: R_ICON[kind], t }); }
    const own = stepOwned(kind, dt, t, job && !rent);
    const on = job && (rent || own); res[kind] = on; RT.jobs[kind] = { job, rent, on };
    if (!on) continue;
    if (kind === 'water'){ if (rent) stepDrone(dt, t); else droneWater(dt, t); }
    else if (kind === 'snow') snowbotStep(dt);
    else if (kind === 'sweep') sweepStep(dt, t);
    else if (kind === 'poop') poopStep(dt);
    else if (kind === 'honey') honeyStep(dt);
  }
  return res;
}

/* ---------- status text ---------- */
const STATE_TXT = { none: '還沒有', idle: '待命', work: '工作中', charge: '充電中', queue: '排隊等充電', refill: '補水中', rest: '沒電躺著' };
function ownedStateText(kind){
  const U = S.robots[kind], K = RK(kind), base = findBase(K.base), now = Date.now();
  if (!tierOf(kind)) return STATE_TXT.none;
  if (U.on === false) return '關閉中';
  if (rentActive(kind, now) && (U.state === 'idle' || U.state === 'charge' || U.state === 'queue' || U.state === 'refill')) return `${STATE_TXT[U.state]}（租的在工作）`;
  if (U.state === 'refill' && U.waitWater) return '等水塔有水';
  if (U.state === 'charge' && base && (base.T.src || 'solar') === 'solar' && isNightAt(now)) return '等天亮充電';
  if (U.state === 'rest' && !base) return `沒電躺著（${BLD[K.base].name}不在場上）`;
  if (U.state === 'idle'){ const j = RT.jobs && RT.jobs[kind]; return j && !j.job ? '待命（沒有工作）' : STATE_TXT.idle; }
  return STATE_TXT[U.state] || U.state;
}
function unitStateText(kind){ if (rentActive(kind, Date.now())){ const j = RT.jobs && RT.jobs[kind]; return j && !j.job ? '待命' : '工作中'; } return ownedStateText(kind); }
function robotChips(st, now){
  for (const kind of KINDS){ const U = S.robots[kind], tier = tierOf(kind), img = `<img src="${IMGSRC[R_ICON[kind]]}" alt="">`;
    if (rentActive(kind, now)) st.push(`<div class="chip" data-open="robot:${kind}">${img}${KIND_NAME(kind)}（租）${unitStateText(kind)} · 剩 ${fmtDur((S.automation[rentKey(kind)] - now)/1000)}</div>`);
    else if (tier && U.on !== false && ['work','charge','queue','refill','rest'].includes(U.state)) st.push(`<div class="chip${U.state === 'rest' ? ' warnchip' : ''}" data-open="robot:${kind}">${img}${KIND_NAME(kind)} ${ownedStateText(kind)} · 電 ${Math.round(U.batt / robotWorkSec(kind) * 100)}%</div>`);
  }
}
$('status').addEventListener('click', e => { const c = e.target.closest('[data-open^="robot:"]'); if (c) openAuto(c.dataset.open.slice(6)); });

/* ---------- panels ---------- */

  return h;

}

$('autoBtn').onclick = () => openAuto();
function heatmapCanvas(mi){
