<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮島農場 SkyFarm</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="浮島農場">
<meta name="application-name" content="浮島農場">
<meta name="theme-color" content="#7fd0f5">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: full-bleed isometric farm canvas; status chips float top; tray + hint + tool dock float bottom; modals for 圖鑑/自動化/存檔 */
  --sky:#bfe4e2;
  --ink:#1e3a2a;
  --muted:#58705f;
  --panel:#f5fbf1;
  --line:#cfe1c4;
  --accent:#f2c23c;
  --coin:#e0a114;
  --water:#3f8fc8;
  --warn:#c5452f;
  --font-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;overflow:hidden}
#farm{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:14px;box-shadow:0 3px 0 rgba(30,58,42,.12);display:flex;align-items:center;gap:8px;padding:5px 10px}
.hud{position:absolute;top:8px;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;justify-content:space-between;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.hud .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lvl{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:17px;flex:none}
.player{padding:4px 10px 4px 4px}
.farmname{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1}
.bar{width:110px;height:7px;border-radius:6px;background:#dde9d4;margin-top:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .3s}
#xpbar{background:var(--accent)}
#waterbar{background:var(--water)}
.small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{font-family:var(--font-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:4px 10px}
.stat img{width:22px;height:22px}
.water{flex-direction:column;align-items:stretch;gap:0;padding:4px 10px}
.water .row{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.water img{width:18px;height:18px}
.water .bar{width:90px}
.iconbtn{padding:4px 9px;font-size:13px;font-weight:500;gap:5px}
.iconbtn img{width:22px;height:22px}
.maps{display:flex;gap:4px;padding:3px}
.maps button{border:0;background:transparent;border-radius:10px;padding:4px 10px;font-weight:500}
.maps button.on{background:var(--ink);color:var(--accent)}
.weather img{width:22px;height:22px}
.utilities img{width:20px;height:20px;transition:filter .2s,opacity .2s}
.utilities .off img,.utilities img.off{filter:grayscale(1);opacity:.4}
.status .warnchip{border-color:var(--warn);color:var(--warn)}
.status .billchip{cursor:pointer}
.fc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.fc-row{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin:6px 0 10px}
.fc-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:rgba(255,255,255,.65);border:1px solid var(--line);font-size:12px}
.fc-cell img{width:28px;height:28px}.fc-cell small{font-size:11px;color:#55705f}.fc-cell.past{opacity:.45}.fc-cell.rain{background:#dbeefa}
.fc-cell.snow{background:#eef4fb;border-color:#9fb8d0}
.fc-risks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.fc-risk{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:#fff}
.fc-risk img{width:18px;height:18px}.fc-risk.r1{background:#fff4d6;border-color:#d9b44a}.fc-risk.r2{background:#ffe3da;border-color:var(--warn);color:var(--warn)}
.tool[hidden]{display:none!important}
.news{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.news li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.5}
.news img{width:28px;height:28px;flex:none}
.clogbar i{background:linear-gradient(90deg,#d9b44a,var(--warn))!important}
.cards.robots{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card.robot h4 img{width:26px;height:26px}.card.robot h5{margin:4px 0 0;font-size:13px;display:flex;gap:6px;align-items:center}
.card.robot .row{flex-wrap:wrap;gap:6px}.card.robot .btn{font-size:12.5px;padding:5px 9px}
.btn.alt{background:#fff;color:var(--ink)}
.heatbox{background:#f3f7ee;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;justify-content:center;overflow:hidden}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 6px;vertical-align:-1px}
.fc-tip{background:#fffbe9;border-radius:10px;padding:8px 10px;margin:8px 0}.fc-event{display:flex;gap:6px;align-items:center;margin:0 0 8px}.fc-event img{width:22px;height:22px}
.droptarget{outline:3px solid #ffd65a!important;box-shadow:0 0 0 6px rgba(255,214,90,.45)!important}
.status{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:96px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.status .chip{font-size:12px;padding:3px 8px;gap:5px;pointer-events:auto}
.status img{width:18px;height:18px}

.bottom{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bottom>*{pointer-events:auto}
.tray{width:min(760px,100%);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:7px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;box-shadow:0 3px 0 rgba(30,58,42,.12)}
.tray .sep{flex:none;width:2px;background:var(--line);margin:4px 2px;border-radius:2px}
.item{flex:none;width:88px;border:2px solid transparent;border-radius:12px;background:#fff;padding:3px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.item canvas{width:56px;height:56px}
.item b{font-family:var(--font-display);font-size:14px}
.item small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item small img{width:11px;height:11px}
.item.sel{border-color:var(--ink);background:#fffbe9}
.item.locked{opacity:.5}
.item .tag{position:absolute;top:3px;left:3px;background:var(--ink);color:var(--accent);font-size:10px;border-radius:6px;padding:1px 5px;font-weight:700}
.item .info{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:#e6f1df;font-size:11px;font-weight:700;padding:0;line-height:20px}
.item .count{position:absolute;top:3px;left:3px;background:var(--water);color:#fff;font-size:10px;border-radius:6px;padding:1px 5px;font-weight:700}
.hint{background:var(--ink);color:#f3f7ee;font-size:12.5px;padding:5px 12px;border-radius:999px;max-width:100%;text-align:center}
.dock{display:flex;gap:2px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:4px;box-shadow:0 3px 0 rgba(30,58,42,.12);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tool{flex:none;width:58px;border:0;background:transparent;border-radius:13px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tool img{width:28px;height:28px}
.tool span{font-size:11.5px;font-weight:500}
.tool.on{background:var(--ink);color:var(--accent)}
.tool:hover:not(.on){background:#e6f1df}

.toast{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:calc(100% - 32px);text-align:center;transition:opacity .25s;opacity:0;pointer-events:none;z-index:5}
.toast.show{opacity:1}
.toast.big{background:var(--accent);color:var(--ink);font-family:var(--font-display);font-size:17px;font-weight:700}

.modal{position:absolute;inset:0;background:rgba(20,40,28,.35);display:flex;align-items:center;justify-content:center;z-index:10;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:18px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.2);min-width:0}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.sheet header h2{margin:0;font-family:var(--font-display);font-size:20px;flex:1}
.close{border:0;background:#e6f1df;border-radius:10px;padding:6px 12px;font-weight:700}
.tabs{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:thin;flex:none}
.tabs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 10px;font-weight:500}
.tabs button.on{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.body{padding:4px 14px 14px;overflow:auto;min-height:0;user-select:text;-webkit-user-select:text}
.body p{margin:6px 0;line-height:1.6;max-width:70ch}
.body h3{font-family:var(--font-display);margin:12px 0 6px;font-size:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin:6px 0}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid #e3eedb;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:#eef6e8;font-weight:700;position:sticky;top:0}
td.num,th.num{text-align:right}
tr.locked td{color:#93a497}
tr.cur td{background:#fffbe9}
.pill{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;background:#e6f1df}
.pill.lock{background:#eceae4;color:#7b7f78}
.pill.ok{background:#d9f0d0;color:#2d6a33}
.ico{width:28px;height:28px;vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.btn{border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:10px;padding:7px 12px;font-weight:700}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.warn{background:#fff;border-color:var(--warn);color:var(--warn)}
.btn.warn.armed{background:var(--warn);color:#fff}
.units{display:flex;flex-direction:column;gap:4px;margin:4px 0 6px}
.unitrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;background:#f6f2e6;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.unitrow b{color:var(--accent,#3d7a4f)}
.unitrow{flex-wrap:nowrap}.unitrow>span:nth-of-type(2){flex:1;min-width:0}.unitrow .btn.sm{flex:none;white-space:nowrap}
.btn.sm{font-size:11px;padding:2px 8px;min-height:0;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
textarea{width:100%;min-height:90px;font:12px ui-monospace,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;resize:vertical;background:#fff;color:var(--ink)}
input[type=number]{width:80px;font:inherit;border:2px solid var(--line);border-radius:8px;padding:4px 6px;background:#fff;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px 0}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h4{margin:0;font-family:var(--font-display);font-size:16px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv>span:nth-child(odd){color:var(--muted)}
.forecast{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.forecast div{flex:none;width:44px;text-align:center;font-size:11px;border-radius:8px;background:#fff;border:1px solid var(--line);padding:3px 0}
.forecast div.rain{background:#dcecf8;border-color:#9cc3e3}
.forecast img{width:22px;height:22px;display:block;margin:2px auto}
.tut{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:min(440px,calc(100% - 32px));background:var(--panel);border:3px solid var(--accent);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:8}
.tut h3{margin:2px 0 4px;font-family:var(--font-display);font-size:18px}
.tut p{margin:0 0 6px;line-height:1.6;font-size:13.5px}
.tut .row{margin:6px 0 0}
.tut-k{font-size:11px;font-weight:700;color:var(--muted)}
.spot{outline:3px solid var(--accent)!important;outline-offset:2px;animation:spotPulse 1s ease-in-out infinite;position:relative;z-index:7}
@keyframes spotPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,194,60,.7)}50%{box-shadow:0 0 0 7px rgba(242,194,60,0)}}
#storageBtn.full{border-color:var(--warn);color:var(--warn)}
@media (prefers-reduced-motion:reduce){.spot{animation:none}}
.flycoin{position:fixed;width:22px;height:22px;pointer-events:none;z-index:30;left:0;top:0}
#coinChip.bump{animation:coinBump .25s ease-out}
@keyframes coinBump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#coins{display:inline-block;min-width:3ch}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:8px 0}
.slot{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.slot.last{border-color:var(--accent)}
.slot h4{margin:0;font-family:var(--font-display);font-size:18px;display:flex;align-items:center;gap:8px;min-width:0}
.slot h4 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .stats b{display:block;color:var(--ink);font-size:14px}
.slot .row{margin:2px 0 0}
.newslot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.newslot input{flex:1 1 180px;min-width:0;font:inherit;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;color:var(--ink)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:var(--font-display);font-size:18px;line-height:1.7;background:var(--sky);z-index:20;white-space:pre-line;user-select:text;-webkit-user-select:text}
@media (max-width:520px){.tut{top:auto;bottom:150px}.bar{width:76px}.water .bar{width:64px}.farmname{font-size:13px}.item{width:80px}.tool{width:52px}.status{top:128px}}
@media (prefers-reduced-motion:reduce){.bar>i,.toast{transition:none}}

/* ---------- v1.8.1 mobile layout ---------- */
.loc{display:block;border:0;background:none;padding:0;margin-top:1px;font-size:11px;color:#2f7fa8;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;text-decoration:underline dotted}
#moreBtn{display:none;font-size:20px;font-weight:800;line-height:1;padding:4px 12px}
.zoomctl{position:absolute;display:none;flex-direction:column;gap:6px;z-index:4}
.zoomctl button{width:40px;height:40px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:18px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:0}
.movebar{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:6px 8px 6px 12px;z-index:6;max-width:calc(100% - 24px);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.movebar .btn{white-space:nowrap;flex:none}.movebar span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movebar .btn{padding:6px 12px;font-size:13px}
.traytog{display:none;align-self:flex-start;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:1px 10px;font-size:11.5px;color:var(--muted);margin-bottom:-4px}
.modal.bsheet{align-items:flex-end;padding:0}.modal.bsheet .sheet{border-radius:22px 22px 0 0;width:100%;max-width:640px}
.moregrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:4px 0 10px}
.moregrid button{background:#fff;border:2px solid #e2ecd9;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;font-size:12.5px}
.moregrid img{width:34px;height:34px}.moregrid b{font-size:26px;line-height:34px;height:34px}
/* shared mobile */
body.m .zoomctl{display:flex}
body.m #autoBtn,body.m #expandBtn,body.m #bookBtn,body.m #menuBtn{display:none}
body.m #moreBtn{display:flex}
body.m #storageText,body.m .utilities span,body.m .wt-more{display:none}
body.m .iconbtn{padding:4px 8px;min-height:40px}
body.m #xptext{display:none}
body.m .player{flex:1;min-width:0}
body.m .player>div:last-child{min-width:0;flex:1}
body.m .farmname{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.m .bar{width:auto;height:5px;margin-top:3px}
body.m .stat{font-size:14px;padding:4px 8px}body.m .stat img{width:18px;height:18px}
body.m .water{padding:4px 8px}body.m .water .row{font-size:12px}body.m .water .bar{width:auto}
body.m .traytog{display:block}
body.m .tool:hover:not(.on){background:transparent}
body.m .status{pointer-events:auto;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 22px 4px 7px;min-height:40px;max-width:calc(100% - 16px);overflow:hidden;box-shadow:0 3px 0 rgba(30,58,42,.12)}
body.m .status::after{content:"▾";position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
body.m .status:empty{display:none}
body.m .status:not(.open) .chip{font-size:0;padding:1px;border:0;box-shadow:none;background:none;gap:0;flex:none}
body.m .status:not(.open) .chip.warnchip{background:#ffe3da;border-radius:6px}
body.m .status:not(.open) .chip img{width:18px;height:18px}
body.m .status.open{z-index:6;flex-direction:column;align-items:flex-end;background:none;border-color:transparent;box-shadow:none;padding:0;max-width:calc(100% - 16px);overflow:visible}
body.m .status.open::after{content:"▴ 收起";position:static;transform:none;order:-1;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:2px 8px;font-size:11.5px;color:var(--ink)}
body.m .status.open .chip{font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.1);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
body.m .hint{font-size:11.5px;padding:4px 10px}
/* portrait */
body.m-port .hud{flex-direction:column;gap:6px;flex-wrap:nowrap}
body.m-port .hud .grp:first-child{flex-wrap:nowrap;width:100%;align-items:stretch}
body.m-port .hud .grp:last-child{flex-wrap:nowrap}
body.m-port .lvl{width:32px;height:32px;font-size:16px}

<body>


<div id="app">

      <button class="chip iconbtn weather" id="weatherBtn" title="天氣預報"><img data-icon="ui_weather_sun" alt="" id="weatherIcon"><span id="weatherText">晴</span></button>

    </div>

<script>
(async () => {
  const getJSON = async url => { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); };
  let CFG, ATLAS_JSON;
  const viaScript = (src, name) => new Promise((ok, no) => { const el = document.createElement('script'); el.src = src;
    el.onload = () => window[name] ? ok(window[name]) : no(new Error(src)); el.onerror = () => no(new Error(src)); document.head.appendChild(el); });
  try {
    if (location.protocol === 'file:') throw new Error('file');
    [CFG, ATLAS_JSON] = await Promise.all([getJSON('game-config.json'), getJSON('sprites/atlas.json')]);
  } catch (e) {
    try { [CFG, ATLAS_JSON] = await Promise.all([viaScript('game-config.js', 'GAME_CONFIG'), viaScript('sprites/atlas.js', 'GAME_ATLAS')]); }
    catch (e2) { document.getElementById('loading').textContent = '讀不到遊戲定義檔。\n請確認 game-config.json（或 game-config.js）和 sprites 資料夾跟這個頁面放在一起。'; return; }
  }
  document.getElementById('loading').remove();
  (function (CFG, ATLAS_JSON) {
/* ===== 1. core: config, state, rules, simulation ===== */
const ATLAS = ATLAS_JSON.sprites;
const IMGSRC = Object.fromEntries(Object.keys(ATLAS).map(k => [k, 'sprites/' + ATLAS[k].file]));
const R = CFG.rules, HW = 32, HH = 16, BS = R.blockSize, DEPTH = 22;
const KEY = 'greenhill-farm-v2';                       // legacy single save (migrated into a slot)
const SLOTS_KEY = 'greenhill-farm-v2-slots', SLOT_PREFIX = 'greenhill-farm-v2-slot-', BACKUP_PREFIX = 'greenhill-farm-v2-backup-', LAST_SLOT_KEY = 'greenhill-farm-v2-last';
let SLOT = null;                                        // id of the save slot being played
let BACKUP_KEY = 'greenhill-farm-v2-backup';            // per-slot, set when a slot is entered
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, v); return true; } catch(e){ return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const sysMotion = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let motion = sysMotion;
function applyMotion(){ const a = S && S.settings && S.settings.animation; motion = a === 'on' ? true : a === 'off' ? false : sysMotion; }
const IMG = {};
function loadImages(){
  // several sprites can live in one packed sheet: load each file once
  const files = {};
  for (const [k,src] of Object.entries(IMGSRC)) (files[src] = files[src] || []).push(k);
  return Promise.all(Object.entries(files).map(([src, keys]) => new Promise(res => {
    const im = new Image(); im.onload = () => { for (const k of keys) IMG[k] = im; res(); }; im.onerror = () => res(); im.src = src;
  })));
}
const LV = CFG.levels;
const UNLOCK = {};
for (const L of LV) for (const u of L.unlocks) if (!(u in UNLOCK)) UNLOCK[u] = L.level;
for (const L of LV) if (L.specialDeco) UNLOCK[L.specialDeco] = L.level;
const lvInfo = l => LV[Math.max(1, Math.min(l, LV.length)) - 1];
const isUnlocked = id => (UNLOCK[id] || 1) <= S.player.level;
const hasBigBucket = () => S.player.level >= (UNLOCK.big_bucket || 99);

let S;               // persistent game state
const RT = { bonus: {}, bonusVer: -1, decoVer: 0, notices: [] }; // runtime caches

const tkey = (x,y) => x + ',' + y;
const pkey = k => k.split(',').map(Number);
const curMap = () => S.maps[S.cur];
function blockSet(M){ const s = new Set(); for (const [bx,by] of M.blocks) s.add(bx+','+by); return s; }
function inMap(M,x,y){ return M.blocks.some(([bx,by]) => x>=bx*BS && x<bx*BS+BS && y>=by*BS && y<by*BS+BS); }
function mapTiles(M){
  const out = [];
  for (const [bx,by] of M.blocks) for (let y=by*BS; y<by*BS+BS; y++) for (let x=bx*BS; x<bx*BS+BS; x++) out.push([x,y]);
  return out;
}

function newGame(){
  const now = Date.now();
  S = { formatVersion: CFG.meta.saveFormatVersion, configVersion: CFG.meta.configVersion, savedAt: now, lastSim: now,
    player: { coins: R.startCoins, xp: 0, level: 1, water: lvInfo(1).rainStorage || 500 },
    maps: [{ blocks: [[0,0]], tiles: {}, pools: {} }], cur: 0, storage: {},
    automation: { waterUntil: 0, feedUntil: 0 },
    sel: { tool: 'hand', seed: 'wheat', animal: 'egg_hen', deco: 'maple', fish: 'pool', build: 'corn_cake_machine' }, rainSlot: -1, lastFlow: 0,
    inv: {}, settings: { autoBuyFeed: R.autoBuyFeedDefault !== false }, tutorial: { step: 0, done: false, rewarded: false } };
  const T = S.maps[0].tiles;
  for (const [x,y] of [[0,0],[1,0],[0,1],[1,1]]) T[tkey(x,y)] = { t: 'house' };
  const progs = [1.2, 0.95, 0.7, 0.4, 1.1, 0.15];
  let k = 0;
  for (let y=3; y<=4; y++) for (let x=3; x<=5; x++)
    T[tkey(x,y)] = { t: 'soil', m: 3.2, dry: 0, crop: { id: 'wheat', prog: Math.min(1, progs[k]) * CFG.crops.wheat.growSeconds, wither: false, _p: progs[k++] } };
  for (const x of [3,4,5]) T[tkey(x,5)] = { t: 'soil', m: 0, dry: 0, crop: null };
  T['7,6'] = newAnimal('egg_hen'); Object.assign(T['7,6'], { stage: 2, timer: 0 });
  T['8,1'] = { t: 'deco', id: 'maple' }; T['9,5'] = { t: 'deco', id: 'pine' }; T['1,8'] = { t: 'deco', id: 'maple' };
  for (const x of [6,7,8,9]) T[tkey(x,8)] = { t: 'deco', id: 'fence' };
  normalizeWorld(S); RT.decoVer++;
}
function normalizeState(d){
  d.inv = d.inv || {};
  d.settings = Object.assign({ autoBuyFeed: R.autoBuyFeedDefault !== false }, d.settings || {});
  d.tutorial = d.tutorial || { step: -1, done: true, rewarded: true };
  d.sel = Object.assign({ tool: 'hand', seed: 'wheat', animal: 'egg_hen', deco: 'maple', fish: 'pool', build: 'corn_cake_machine' }, d.sel || {});
  for (const M of d.maps){ M.pools = M.pools || {}; }
  normalizeWorld(d);
  return d;
}
/* ----- produce storage ----- */
const invCap = () => lvInfo(S.player.level).produceCapacity || 300;
const invUsed = () => Object.values(S.inv).reduce((a,b) => a + b, 0);
const invFree = () => Math.max(0, invCap() - invUsed());
function invAdd(id, q){ if (q > 0) S.inv[id] = (S.inv[id] || 0) + q; }
function invTake(id, q){ const h = S.inv[id] || 0; const n = Math.min(h, q); if (n > 0){ S.inv[id] = h - n; if (!S.inv[id]) delete S.inv[id]; } return n; }
const itemName = id => (CFG.items[id] && CFG.items[id].name) || id;
// pay a feed requirement from storage, buying the shortfall when allowed
function payFeed(item, qty, dry){
  const have = S.inv[item] || 0, use = Math.min(have, qty), miss = qty - use, cost = miss * (CFG.feedShop[item] || 0);
  if (miss > 0 && (!S.settings.autoBuyFeed || S.player.coins < cost)) return { ok: false, miss, cost, item, qty };
  if (!dry){ invTake(item, use); S.player.coins -= cost; }
  return { ok: true, used: use, bought: miss, cost, item, qty };
}
function newAnimal(id){ const A = CFG.animals[id]; return { t: 'animal', id, stage: 0, timer: 0, cycles: A.lifespanCycles || 0, stack: 0, adultAt: 0, r: Math.random()*10 }; }

/* ----- save / load ----- */
function checksum(str){ let h = 5381; for (let i=0;i<str.length;i++) h = (Math.imul(h,33) ^ str.charCodeAt(i)) >>> 0; return h.toString(16); }
function serialize(){ S.savedAt = Date.now(); const body = JSON.stringify({ ...S, checksum: undefined }); return { body, sum: checksum(body) }; }
function slotList(){ try { const l = JSON.parse(lsGet(SLOTS_KEY)); return Array.isArray(l) ? l : []; } catch(e){ return []; } }
function writeSlotList(l){ lsSet(SLOTS_KEY, JSON.stringify(l)); }
function summarize(d){
  const c = { crops: 0, ready: 0, trees: 0, animals: 0, poolTiles: 0, machines: 0, blocks: 0 };
  for (const M of d.maps){ c.blocks += M.blocks.length;
    for (const k in M.tiles){ const T = M.tiles[k];
      if (T.t === 'soil' && T.crop){ c.crops++; if (T.crop.prog >= CFG.crops[T.crop.id].growSeconds) c.ready++; }
      else if (T.t === 'tree') c.trees++; else if (T.t === 'animal') c.animals++; else if (T.t === 'pool') c.poolTiles++; else if (T.t === 'machine') c.machines++; } }
  return { level: d.player.level, coins: Math.floor(d.player.coins), xp: d.player.xp, maps: d.maps.length, stored: Object.values(d.inv || {}).reduce((a,b) => a + b, 0), ...c };
}
let saveWarned = false;
function save(){
  if (!SLOT || !S) return;
  const { body, sum } = serialize();
  if (!lsSet(SLOT_PREFIX + SLOT, JSON.stringify({ sum, body }))){ if (!saveWarned && typeof toast === 'function'){ saveWarned = true; toast('這台裝置的儲存空間不足，進度沒有存到。請匯出存檔或刪掉不用的農場'); } return; }
  const list = slotList(), e = list.find(x => x.id === SLOT);
  const info = { id: SLOT, name: (S.profile && S.profile.name) || (e && e.name) || '我的農場', savedAt: S.savedAt, createdAt: (e && e.createdAt) || S.savedAt, summary: summarize(S) };
  if (e) Object.assign(e, info); else list.push(info);
  writeSlotList(list);
}
function newSlotId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function migrateLegacy(){
  if (slotList().length) return;
  const d = parseSaved(lsGet(KEY)); if (!d) return;
  const id = newSlotId(); d.profile = d.profile || { name: '我的農場' };
  const body = JSON.stringify({ ...d, checksum: undefined });
  lsSet(SLOT_PREFIX + id, JSON.stringify({ sum: checksum(body), body }));
  writeSlotList([{ id, name: d.profile.name, savedAt: d.savedAt, createdAt: d.savedAt, summary: null }]);
}
function validState(d){ return d && d.formatVersion === 1 && d.player && Array.isArray(d.maps) && d.maps.length && d.automation && d.sel; }
function parseSaved(raw){
  try { const w = JSON.parse(raw); if (!w || !w.body) return null; if (checksum(w.body) !== w.sum) return null; const d = JSON.parse(w.body); return validState(d) ? d : null; }
  catch(e){ return null; }
}
function load(id){ return parseSaved(lsGet(SLOT_PREFIX + (id || SLOT))); }
function exportCode(){ const { body, sum } = serialize(); return 'GHFARM1:' + sum + ':' + btoa(unescape(encodeURIComponent(body))); }
function importCode(code){
  code = (code || '').trim();
  let body, sum;
  if (code.startsWith('GHFARM1:')){
    const parts = code.split(':'); if (parts.length < 3) return { error: '存檔代碼不完整，請確認有完整複製。' };
    sum = parts[1];
    try { body = decodeURIComponent(escape(atob(parts.slice(2).join(':')))); } catch(e){ return { error: '存檔代碼無法解讀，可能少複製了幾個字。' }; }
  } else if (code.startsWith('{')){
    try { const w = JSON.parse(code); body = w.body; sum = w.sum; } catch(e){ return { error: '存檔檔案格式不對。' }; }
  } else return { error: '這不是浮島農場（舊名綠丘小農場）的存檔。' };
  if (!body || checksum(body) !== sum) return { error: '存檔的校驗碼不符，檔案可能損壞或被修改過。' };
  let d; try { d = JSON.parse(body); } catch(e){ return { error: '存檔內容損壞。' }; }
  if (!validState(d)) return { error: '存檔格式版本不支援。' };
  return { data: d };
}

/* ----- weather (deterministic, same for everyone) ----- */
function h32(n){ n = n | 0; n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
const W = CFG.weather;
const slotOf = ms => Math.floor((ms/1000 + W.utcOffsetHours*3600) / W.slotSeconds);
function slotRain(slot){
  if (h32(slot*7919 + W.version*104729) >= W.rainChancePerSlot) return null;
  const startMin = Math.floor(h32(slot*31337 + 17) * (W.rainStartMinuteMax + 1));
  const start = (slot*W.slotSeconds - W.utcOffsetHours*3600 + startMin*60) * 1000;
  return { slot, start, end: start + W.rainMinutes*60000 };
}
function rainAt(ms){ const r = slotRain(slotOf(ms)); return r && ms >= r.start && ms < r.end ? r : null; }
function nextRain(ms, hours = W.forecastHours){ const s0 = slotOf(ms); for (let i=0;i<=hours;i++){ const r = slotRain(s0+i); if (r && r.end > ms) return r; } return null; }

/* ----- deco bonuses ----- */
function bonusMap(mi){
  if (RT.bonusVer !== RT.decoVer){ RT.bonus = {}; RT.bonusVer = RT.decoVer; }
  if (RT.bonus[mi]) return RT.bonus[mi];
  const M = S.maps[mi], out = {};
  for (const k in M.tiles){
    const T = M.tiles[k]; if (T.t !== 'deco') continue;
    const e = CFG.decos[T.id].effect; if (!e || e.range === 'global') continue;
    const [x0,y0] = pkey(k);
    for (let dy=-e.range; dy<=e.range; dy++) for (let dx=-e.range; dx<=e.range; dx++){
      const kk = tkey(x0+dx, y0+dy), b = out[kk] || (out[kk] = { g: 0, m: 0 });
      if (e.type === 'growth') b.g = Math.max(b.g, e.value); else if (e.type === 'moisture') b.m = Math.max(b.m, e.value);
    }
  }
  return RT.bonus[mi] = out;
}
function refillBonus(){
  const ids = new Set();
  for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'deco'){ const e = CFG.decos[T.id].effect; if (e && e.type === 'refill') ids.add(T.id); } }
  let b = 0; for (const id of ids) b += CFG.decos[id].effect.value; return b;
}
let refillCache = { ver: -1, v: 0 };
function refillB(){ if (refillCache.ver !== RT.decoVer){ refillCache = { ver: RT.decoVer, v: refillBonus() }; } return refillCache.v; }

/* ----- fish pools (connected components) ----- */
function poolComponents(M){
  const seen = new Set(), comps = [];
  for (const k in M.tiles){
    if (M.tiles[k].t !== 'pool' || seen.has(k)) continue;
    const comp = [], st = [k]; seen.add(k);
    while (st.length){ const c = st.pop(); comp.push(c); const [x,y] = pkey(c);
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n = tkey(x+dx,y+dy); if (!seen.has(n) && M.tiles[n] && M.tiles[n].t === 'pool'){ seen.add(n); st.push(n); } } }
    comp.sort(); comps.push(comp);
  }
  return comps;
}
function reconcilePools(M){
  const old = M.pools || {}, next = {};
  for (const comp of poolComponents(M)){
    const key = comp[0]; let carried = null;
    for (const t of comp) if (old[t] && old[t].fish){ carried = old[t]; break; }
    next[key] = Object.assign({ fish: null, stage: 0, timer: 0 }, carried || {}, { n: comp.length, tiles: comp });
  }
  M.pools = next;
}
function poolOf(M, k){ for (const pk in M.pools) if (M.pools[pk].tiles.includes(k)) return pk; return null; }
function poolSizeBonus(n){ let b = 0; for (const s of CFG.fishPool.sizeBonus) if (n >= s.minTiles) b = s.bonus; return b; }

/* ----- counts ----- */
function countAnimals(){ let n = 0; for (const M of S.maps) for (const k in M.tiles) if (M.tiles[k].t === 'animal') n++; return n; }
function countPoolTiles(){ let n = 0; for (const M of S.maps) for (const k in M.tiles) if (M.tiles[k].t === 'pool') n++; return n; }
function totalBlocks(){ return S.maps.reduce((a,M) => a + M.blocks.length, 0); }

/* ----- simulation ----- */
const isAdult = (T,A) => T.stage >= A.growStages;
function canFeed(T,A){
  if (T.timer > 0) return false;
  if (!isAdult(T,A)) return true;
  if (A.type === 'meat') return false;
  return T.cycles > 0 && (T.stack || 0) < R.animalStackMax;
}
const feedNeed = (T,A) => isAdult(T,A) ? A.cycleFeedQty : A.stageFeedQty;
function feedAnimal(T,A){
  const r = payFeed(A.feedItem, feedNeed(T,A)); if (!r.ok) return r;
  if (!isAdult(T,A)) T.timer = A.stageSeconds; else { T.timer = A.cycleSeconds; T.cycles--; }
  return r;
}
function stepPlant(T, dt, b, wetAll, env = 1){
  const wu = T.t === 'tree' ? 1 : (T.crop ? CFG.crops[T.crop.id].waterUse : 1);
  const levelSec = R.moistLevelSeconds / wu * (1 + (b ? b.m : 0));
  if (wetAll){ T.m = R.moistMaxLevel; T.dry = 0; if (T.crop) T.crop.wither = false; }
  const wet = T.m > 0;
  if (wet){ T.m = Math.max(0, T.m - dt/levelSec); T.dry = 0; } else T.dry = (T.dry || 0) + dt;
  const g = (1 + (b ? b.g : 0)) * (wet ? R.moistGrowthRate : R.dryGrowthRate) * env;
  if (T.t === 'soil' && T.crop && !T.crop.wither){
    const C = CFG.crops[T.crop.id];
    if (T.crop.prog < C.growSeconds) T.crop.prog = Math.min(C.growSeconds, T.crop.prog + dt*g);
    if (T.m <= 0 && T.dry >= R.droughtWitherSeconds) T.crop.wither = true;
  } else if (T.t === 'tree'){
    const D = CFG.trees[T.id], need = T.first ? D.firstFruitSeconds : D.fruitIntervalSeconds;
    if (T.prog < need) T.prog = Math.min(need, T.prog + dt*g);
  }
}
function killAnimal(M, k, T, why){
  delete M.tiles[k];
  RT.notices.push({ kind: 'death', name: CFG.animals[T.id].name, why, map: S.maps.indexOf(M), k });
}
function stepAnimal(M, k, T, dt, t, feedOn){
  const A = CFG.animals[T.id];
  if (T.timer > 0){
    T.timer -= dt;
    if (T.timer <= 0){
      T.timer = 0;
      if (!isAdult(T,A)){ T.stage++; if (isAdult(T,A) && A.type === 'meat') T.adultAt = t; }
      else if (A.type === 'producer') T.stack = (T.stack || 0) + 1;
    }
  }
  if (T.timer === 0 && feedOn && canFeed(T,A)) feedAnimal(T,A);
  if (A.type === 'meat' && isAdult(T,A) && T.adultAt && t - T.adultAt > R.meatAdultLifespanSeconds*1000) killAnimal(M, k, T, 'old');
  else if (A.type === 'producer' && isAdult(T,A) && T.cycles <= 0 && T.timer === 0 && !(T.stack > 0)) killAnimal(M, k, T, 'old');
}
function stepPool(P, dt, feedOn){
  if (!P.fish) return; const F = CFG.fish[P.fish];
  if (P.timer > 0){ P.timer -= dt; if (P.timer <= 0){ P.timer = 0; P.stage++; } }
  if (P.timer === 0 && P.stage < F.stages && feedOn){ const r = payFeed(F.feedItem, F.stageFeedQtyPerTile * P.n); if (r.ok) P.timer = F.stageSeconds; }
}
function stepAll(dt, t){
  const P = S.player, L = lvInfo(P.level);
  const rainNow = farmRain(t);
  stepWorld(dt, t, rainNow);
  const rain = rainAt(t);
  if (rain && S.rainSlot !== rain.slot){ S.rainSlot = rain.slot; if (rainNow) RT.notices.push({ kind: 'rain' }); }
  if (rainNow) P.water = Math.max(P.water, rainCapC());
  const droneWork = stepUnit('water', dt, t), feedOn = stepUnit('feed', dt, t);
  if (droneWork && !rainNow) droneWater(dt, t);
  S.maps.forEach((M, mi) => {
    const bonus = bonusMap(mi);
    for (const k in M.tiles){
      const T = M.tiles[k];
      if (T.t === 'soil' || T.t === 'tree') stepPlant(T, dt, bonus[k], rainNow, envRate(mi, k, t));
      else if (T.t === 'animal') stepAnimal(M, k, T, dt, t, feedOn);
      else if (T.t === 'machine' && T.state === 'working' && t >= T.until) T.state = 'done';
    }
    for (const pk in M.pools) stepPool(M.pools[pk], dt, feedOn);
  });
  stepDoll(dt);
  stepBilling(t);
}
function simulateTo(toMs){
  let t = Math.max(S.lastSim, toMs - 7*86400e3);
  while (t < toMs){ const dt = Math.min(60, (toMs - t)/1000); t += dt*1000; stepAll(dt, t); }
  S.lastSim = toMs;
}

/* ----- economy helpers ----- */
function addXP(n){
  const P = S.player; P.xp += n;
  const ups = [];
  while (P.level < R.maxLevel && P.level < LV.length && P.xp >= LV[P.level].xpToReach){
    P.level++; const L = lvInfo(P.level); P.coins += L.coinReward;
    if (L.specialDeco) S.storage[L.specialDeco] = (S.storage[L.specialDeco] || 0) + 1;
    ups.push(L);
  }
  return ups;
}
function nextBlockInfo(){
  const idx = totalBlocks() + 1, rows = CFG.expansion.blocks;
  if (idx <= rows.length) return rows[idx-1];
  const last = rows[rows.length-1];
  return { index: idx, map: Math.ceil(idx / R.maxBlocksPerMap), level: R.maxLevel, cost: last.cost + CFG.expansion.beyondCostStep * (idx - rows.length) };
}
function expansionCandidates(M){
  if (M.blocks.length >= R.maxBlocksPerMap) return [];
  const has = blockSet(M), out = [];
  for (const [bx,by] of M.blocks) for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const k = (bx+dx)+','+(by+dy); if (!has.has(k) && !out.some(o => o.join(',') === k)) out.push([bx+dx, by+dy]);
  }
  return out;
}

/* ===== 2. rendering ===== */
const cv = document.getElementById('farm');
const ctx = cv.getContext('2d');
let dpr = 1, VW = 0, VH = 0;
const cam = { x: 0, y: 0, z: 1 };

const fx = [];
const center = (x,y) => ({ cx: (x-y)*HW, cy: (x+y)*HH + HH });

function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1); VW = r.width; VH = r.height;
  cv.width = Math.round(VW*dpr); cv.height = Math.round(VH*dpr);
}
function mapBounds(M){
  let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  for (const [bx,by] of M.blocks){
    const xs = [bx*BS, bx*BS+BS], ys = [by*BS, by*BS+BS];
    for (const x of xs) for (const y of ys){ const sx = (x-y)*HW, sy = (x+y)*HH; minX = Math.min(minX,sx); maxX = Math.max(maxX,sx); minY = Math.min(minY,sy); maxY = Math.max(maxY,sy); }
  }
  return { minX, maxX, minY: minY - 70, maxY: maxY + DEPTH };
}
function fitCamera(){
  const b = mapBounds(curMap()), top = 110, bot = VH - (VW < 600 ? 170 : 200);
  const z = Math.min((VW - 24) / (b.maxX - b.minX), Math.max(120, bot - top) / (b.maxY - b.minY));
  cam.z = Math.max(0.45, Math.min(1.6, z));
  cam.x = VW/2 - (b.minX + b.maxX)/2 * cam.z;
  cam.y = (top + bot)/2 - (b.minY + b.maxY)/2 * cam.z;
}
function toWorld(sx,sy){ const r = cv.getBoundingClientRect(); return { wx: (sx - r.left - cam.x)/cam.z, wy: (sy - r.top - cam.y)/cam.z }; }
function toTileAny(sx,sy){ const { wx, wy } = toWorld(sx,sy); const a = wx/HW, b = wy/HH; return { x: Math.floor((a+b)/2), y: Math.floor((b-a)/2) }; }

function frameOf(name, t, seed = 0){ const a = ATLAS[name]; if (!a || a.frames <= 1) return 0; return Math.floor(t * a.fps + seed) % a.frames; }
function spr(name, frame, x, y, flip = false, alpha = 1){
  const a = ATLAS[name], im = IMG[name]; if (!a || !im) return;
  const fw = a.frameWidth, fh = a.frameHeight, s = 0.5, sx = (a.sx || 0) + frame*fw, sy = a.sy || 0;

  if (flip){ ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.drawImage(im, sx, sy, fw, fh, -a.anchor[0]*s, -a.anchor[1]*s, fw*s, fh*s); ctx.restore(); }
  else ctx.drawImage(im, sx, sy, fw, fh, x - a.anchor[0]*s, y - a.anchor[1]*s, fw*s, fh*s);

}
function dotc(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
function diamondPath(cx,cy,s = 1){ ctx.beginPath(); ctx.moveTo(cx,cy-HH*s); ctx.lineTo(cx+HW*s,cy); ctx.lineTo(cx,cy+HH*s); ctx.lineTo(cx-HW*s,cy); ctx.closePath(); }
function bubble(x, y, text, iconName, bg = '#fff'){
  ctx.font = '700 9px ' + getComputedStyle(document.documentElement).getPropertyValue('--font-body');
  const tw = text ? ctx.measureText(text).width : 0, w = (iconName ? 13 : 0) + tw + 8, h = 15;
  ctx.fillStyle = bg; ctx.strokeStyle = '#1e3a2a'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x - w/2, y - h, w, h, 6); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-3, y); ctx.lineTo(x, y+4); ctx.lineTo(x+3, y); ctx.fill();
  let cx = x - w/2 + 4;
  if (iconName && IMG[iconName]){ ctx.drawImage(IMG[iconName], cx, y - h + 1.5, 12, 12); cx += 13; }
  if (text){ ctx.fillStyle = '#1e3a2a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, cx, y - h/2 + .5); }
}
function maskAt(M, x, y, pred){
  let m = 0;
  if (pred(M.tiles[tkey(x,y-1)])) m |= 1; if (pred(M.tiles[tkey(x+1,y)])) m |= 2;
  if (pred(M.tiles[tkey(x,y+1)])) m |= 4; if (pred(M.tiles[tkey(x-1,y)])) m |= 8;
  return String(m).padStart(2,'0');
}
const isPond = T => T && T.t === 'deco' && T.id === 'pond';
const isPool = T => T && T.t === 'pool';
const isFence = T => T && T.t === 'deco' && T.id === 'fence' && !T.fallen;
const DECO_SPR = { maple:'deco_maple_idle', pine:'deco_pine_idle', flowers:'deco_flowers_idle', hay:'deco_hay_idle', scarecrow:'deco_scarecrow_sway',
  gold_scarecrow:'deco_gold_scarecrow_sway', water_tower:'deco_water_tower_idle', windmill:'deco_windmill_spin', rainbow_windmill:'deco_rainbow_windmill_spin',
  rain_barrel:'deco_rain_barrel_idle', beehive:'deco_beehive_buzz', stone_well:'deco_stone_well_idle' };
function cropSprite(T){

function treeReady(T){ const D = CFG.trees[T.id]; return T.prog >= (T.first ? D.firstFruitSeconds : D.fruitIntervalSeconds); }
function treeSprite(T){

function drawWorld(t, now){

function floatText(x, y, text, color, size = 13){ fx.push({ x, y, text, color, size, t0: performance.now()/1000, life: 1.3, map: S.cur }); }
function spriteFx(name, x, y){ fx.push({ name, x, y, t0: performance.now()/1000, life: ATLAS[name] ? ATLAS[name].frames / ATLAS[name].fps : 1, map: S.cur }); }
function drawFx(t){
  const font = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
  for (let i = fx.length - 1; i >= 0; i--){
    const e = fx[i], age = t - e.t0;
    if (age > e.life){ fx.splice(i,1); continue; }
    if (e.map !== S.cur) continue;
    if (e.name){ const a = ATLAS[e.name]; spr(e.name, Math.min(a.frames-1, Math.floor(age*a.fps)), e.x, e.y); continue; }
    const k = age / e.life; ctx.globalAlpha = 1 - k*k;
    ctx.font = `700 ${e.size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
    const yy = e.y - age*28; ctx.strokeText(e.text, e.x, yy); ctx.fillStyle = e.color; ctx.fillText(e.text, e.x, yy);
    ctx.globalAlpha = 1;

}
function drawBackground(t, raining){

  if (raining){ g.addColorStop(0,'#8fb0bd'); g.addColorStop(1,'#a9c4b4'); } else { g.addColorStop(0,'#a9dbe0'); g.addColorStop(.6,'#cdebd9'); g.addColorStop(1,'#bfe0b0'); }
  ctx.fillStyle = g; ctx.fillRect(0,0,VW,VH);
  if (!raining){ ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i=0;i<4;i++){ const sp = 6 + i*3, x = ((t*sp + i*330) % (VW+260)) - 130, y = 140 + i*((VH-300)/4);
      ctx.beginPath(); ctx.ellipse(x,y,46,13,0,0,Math.PI*2); ctx.ellipse(x+28,y-8,30,12,0,0,Math.PI*2); ctx.ellipse(x-26,y-4,26,10,0,0,Math.PI*2); ctx.fill(); } }

// cloud shadows drift across the farm in world space, so they zoom and pan with the map
function drawCloudShadows(t, now){
  const a = ATLAS.weather_cloud_shadow, im = IMG.weather_cloud_shadow;
  if (!a || !im || !motion || farmRain(now) || !farmCloudy(now) || dayPhase(now).light <= 0) return;
  const M = S.maps[S.cur]; let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [bx,by] of M.blocks) for (const [cx,cy] of [[bx*BS,by*BS],[bx*BS+BS,by*BS],[bx*BS,by*BS+BS],[bx*BS+BS,by*BS+BS]]){
    const wx = (cx-cy)*HW, wy = (cx+cy)*HH; x0 = Math.min(x0,wx); x1 = Math.max(x1,wx); y0 = Math.min(y0,wy); y1 = Math.max(y1,wy); }
  const w = 360, h = 180, span = (x1 - x0) + w*2, light = dayPhase(now).light;
  ctx.save(); ctx.beginPath();
  for (const [bx,by] of M.blocks){ const P = [[bx*BS,by*BS],[bx*BS+BS,by*BS],[bx*BS+BS,by*BS+BS],[bx*BS,by*BS+BS]].map(([cx,cy]) => [(cx-cy)*HW, (cx+cy)*HH]);
    ctx.moveTo(P[0][0], P[0][1]); for (let j=1;j<4;j++) ctx.lineTo(P[j][0], P[j][1]); ctx.closePath(); }
  ctx.clip();
  ctx.globalAlpha = 0.9 * light;
  for (let i=0;i<3;i++){
    const x = x0 - w + ((t*10 + i*span/3) % span), y = y0 + (y1 - y0) * (0.2 + i*0.3) - h/2 + Math.sin(t*0.05 + i)*12;
    ctx.drawImage(im, (i % a.frames)*a.frameWidth, 0, a.frameWidth, a.frameHeight, x - w/2, y, w, h);
  }
  ctx.globalAlpha = 1; ctx.restore();
}
function drawRain(t){
  const a = ATLAS.weather_rain_fall, im = IMG.weather_rain_fall; if (!a || !im) return;
  const f = Math.floor(t*a.fps) % a.frames;
  for (let y=0; y<VH; y+=256) for (let x=0; x<VW; x+=256) ctx.drawImage(im, f*256, 0, 256, 256, x, y, 256, 256);

function frame(){
  if (!S){ ctx.setTransform(dpr,0,0,dpr,0,0); drawBackground(performance.now()/1000, false); requestAnimationFrame(frame); return; }
  const t = performance.now()/1000, now = Date.now(), raining = farmRain(now);
  RT.frameDt = RT.lastT ? t - RT.lastT : .016; RT.lastT = t;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBackground(t, raining);
  ctx.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*cam.x,dpr*cam.y);
  drawWorld(t, now);
  drawCloudShadows(t, now);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawSky(t, now);
  if (raining && motion) drawRain(t);
  drawCarry(t);
  requestAnimationFrame(frame);

const UI = { expand: false };
const fmtN = n => Math.floor(n).toLocaleString('zh-TW');
function fmtDur(sec){
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec} 秒`;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60);
  if (h === 0) return `${m} 分`;
  return m ? `${h} 小時 ${m} 分` : `${h} 小時`;
}
function spend(n){ if (S.player.coins < 0){ toast('金幣是負的，暫時不能花錢。先收成、賣東西或拔雜草賺回來'); return false; } if (S.player.coins < n){ toast(`金幣不夠，還差 ${fmtN(n - S.player.coins)}`); return false; } S.player.coins -= n; return true; }
function gain(coin, xp, x, y){
  if (coin > 0) flyCoins(worldToScreen(x, y - 20), coin);
  S.player.coins += coin;
  if (coin) floatText(x, y - 28, `+${fmtN(coin)}`, '#c98a0c', 14);
  if (xp) floatText(x + 16, y - 12, `+${fmtN(xp)} 經驗`, '#3c7a3f', 11);
  const ups = addXP(xp);
  for (const L of ups){
    const names = L.unlocks.filter(u => !u.startsWith('block:')).map(nameOf).filter(Boolean);
    let msg = `升到第 ${L.level} 級！獎勵 ${fmtN(L.coinReward)} 金幣`;
    if (L.specialDeco) msg += `，獲得${CFG.decos[L.specialDeco].name}（在裝飾的倉庫裡）`;
    if (names.length) msg += `。解鎖：${names.join('、')}`;
    toast(msg, true, 4200);
    UIbuildTray();
  }
}
function nameOf(id){
  if (id && id.startsWith && id.startsWith('doll_') && CFG.weatherDolls && CFG.weatherDolls.types[id.slice(5)]) return CFG.weatherDolls.types[id.slice(5)].name;
  if (CFG.devices && CFG.devices[id]) return CFG.devices[id].name;
  if (CFG.crops[id]) return CFG.crops[id].name; if (CFG.trees[id]) return CFG.trees[id].name;
  if (CFG.animals[id]) return CFG.animals[id].name; if (CFG.fish[id]) return CFG.fish[id].name;
  if (CFG.decos[id]) return CFG.decos[id].name; if (CFG.automation[id]) return CFG.automation[id].name;
  if (CFG.machines && CFG.machines[id]) return CFG.machines[id].name; if (CFG.items && CFG.items[id]) return CFG.items[id].name;
  if (id === 'fish_pool') return '魚池'; if (id === 'big_bucket') return '大水桶';
  return null;
}
function lockedMsg(id){ return `${nameOf(id)}要到第 ${UNLOCK[id]} 級才解鎖`; }

/* deliver goods into produce storage; asks when full. finalize() runs only if the player didn't cancel */
function deliver(goods, x, y, finalize, label){
  goods = goods.filter(g => g.qty > 0);
  const total = goods.reduce((a,g) => a + g.qty, 0), free = invFree();
  const put = () => { let room = invFree(), left = [];
    for (const g of goods){ const n = Math.min(room, g.qty); invAdd(g.id, n); room -= n; if (g.qty - n > 0) left.push({ id: g.id, qty: g.qty - n }); }
    return left; };
  const showIn = () => { const txt = goods.map(g => `${itemName(g.id)} +${g.qty}`).join('、'); floatText(x, y - 40, `${txt} 進倉庫`, '#2f6a3a', 11); };
  if (total <= free){ put(); showIn(); finalize(); afterAction(); return; }
  openFullPrompt(goods, free, choice => {
    if (choice === 'cancel') return;
    const left = put();
    if (choice === 'sell'){ const coin = left.reduce((a,g) => a + g.qty * (CFG.items[g.id] ? CFG.items[g.id].sellPrice : 0), 0); flyCoins(worldToScreen(x, y - 20), coin); S.player.coins += coin; if (coin) floatText(x, y - 40, `直接賣掉 +${fmtN(coin)}`, '#c98a0c', 12); }
    else floatText(x, y - 40, '多的丟棄了', '#8a5d36', 11);
    finalize(); afterAction();
  });
}
function harvestCrop(T, cx, cy){
  const C = CFG.crops[T.crop.id], id = T.crop.id;
  if (T.crop.wither){ // withered and not revived: sold on the spot at the withered rate
    const coin = Math.round(C.sellPrice * (C.yield || 1) * R.witheredHarvestRate), xp = Math.round(C.xp * R.witheredHarvestRate);
    gain(coin, xp, cx, cy); floatText(cx, cy - 44, '枯萎直接收 8 折', '#8a5d36', 11); T.crop = null; tutEvent('harvestCrop'); return;
  }
  deliver([{ id, qty: C.yield || 1 }], cx, cy, () => { T.crop = null; gain(0, C.xp, cx, cy); tutEvent('harvestCrop'); });
}
function cropLeft(T){ const C = CFG.crops[T.crop.id]; return C.growSeconds - T.crop.prog; }
function waterTile(T, cx, cy){
  const big = hasBigBucket(), cost = R.waterPerTap * (big ? R.bigBucketFillsTo : 1);
  if (T.m >= R.moistMaxLevel - 0.001 && !(T.crop && T.crop.wither)){ toast('這格已經全濕了'); tutEvent('moistFull'); return; }

function feedMsg(r, cx, cy){
  if (!r.ok){ toast(S.settings.autoBuyFeed ? `${itemName(r.item)}不夠，買不足的 ${r.miss} 個要 ${fmtN(r.cost)} 金幣，金幣不夠` : `${itemName(r.item)}不夠（還差 ${r.miss} 個）。可以到倉庫買，或打開「飼料不夠時自動買」`); return false; }
  floatText(cx, cy - 30, r.bought ? `${itemName(r.item)} -${r.qty}（買 ${r.bought} 個 -${fmtN(r.cost)}）` : `${itemName(r.item)} -${r.qty}`, '#8a5d36', 10);
  return true;
}
function tapAnimal(M, k, T, cx, cy){
  const A = CFG.animals[T.id];
  if (A.type === 'meat' && isAdult(T,A)){
    deliver([{ id: A.productItem, qty: 1 }], cx, cy, () => { if (M.tiles[k] === T) delete M.tiles[k]; gain(0, A.xp, cx, cy); });
    return;
  }
  if (T.stack > 0){
    const n = T.stack;
    deliver([{ id: A.productItem, qty: n }], cx, cy, () => {
      T.stack = 0; gain(0, A.xpPerCycle * n, cx, cy);
      if (canFeed(T,A)){ const r = feedAnimal(T,A); if (r.ok){ feedMsg(r, cx, cy - 14); tutEvent('feedAnimal'); } }
      else if (T.cycles <= 0 && T.timer === 0) killAnimal(M, k, T, 'old');
    });
    return;
  }
  if (canFeed(T,A)){ const r = feedAnimal(T,A); if (feedMsg(r, cx, cy)) tutEvent('feedAnimal'); return; }
  if (T.timer > 0){
    const what = isAdult(T,A) ? `${fmtDur(T.timer)}後產出${A.product}` : `${fmtDur(T.timer)}後長大一階（${T.stage + 1}/${A.growStages}）`;
    const life = A.type === 'producer' ? `，還能生產 ${T.cycles} 輪` : '';
    toast(`${A.name} · ${what}${life}`); return;
  }
}
function tapPool(M, pk, cx, cy){
  const P = M.pools[pk];
  if (!P.fish){ toast('這個魚池是空的，用「魚池」工具選魚苗放進來'); return; }
  const F = CFG.fish[P.fish];
  if (P.stage >= F.stages){
    const bonus = poolSizeBonus(P.n), qty = Math.round(P.n * (1 + bonus)), fid = P.fish;
    deliver([{ id: fid, qty }], cx, cy, () => { gain(0, F.xpPerTile * P.n, cx, cy); if (bonus) floatText(cx, cy - 56, `連通加成 +${Math.round(bonus*100)}%`, '#2f7fa8', 11); P.fish = null; P.stage = 0; P.timer = 0; });
    return;
  }
  if (P.timer === 0){ const r = payFeed(F.feedItem, F.stageFeedQtyPerTile * P.n); if (feedMsg(r, cx, cy)) P.timer = F.stageSeconds; return; }

function lockCell(id){ return isUnlocked(id) ? '<span class="pill ok">已解鎖</span>' : `<span class="pill lock">Lv ${UNLOCK[id]}</span>`; }
function wetHours(wu){ return fmtDur(R.moistLevelSeconds * R.moistMaxLevel / wu); }
function fillsNeeded(C){ return Math.ceil(C.growSeconds / (R.moistLevelSeconds * R.moistMaxLevel / C.waterUse)); }
function bestCropFor(hours){
  const I = hours*3600, drone = Date.now() < S.automation.waterUntil;
  let best = null;
  for (const [id,C] of Object.entries(CFG.crops)){
    if (!isUnlocked(id) || C.isFeed) continue;
    const wet = R.moistLevelSeconds * R.moistMaxLevel / C.waterUse;
    const ready = drone ? C.growSeconds : (C.growSeconds <= wet ? C.growSeconds : wet + (C.growSeconds - wet)/R.dryGrowthRate);
    if (ready > I) continue;
    const wither = !drone && ready > wet ? (I > wet + R.droughtWitherSeconds) : (I > (drone ? 1e12 : wet + R.droughtWitherSeconds));
    const net = C.sellPrice * (C.yield || 1) - C.seedCost;
    if (!best || net > best.net) best = { id, C, net, ready, wither };
  }
  return best;
}

/* coin counter rolling + flying coins */
let coinShown = 0, coinRAF = null, coinHoldUntil = 0, coinFrom = 0, coinTo = 0, coinT0 = 0, coinDur = 0;
function setCoinDisplay(target){
  target = Math.floor(target);
  if (!motion){ coinShown = target; $('coins').textContent = fmtN(target); return; }
  if (target === coinTo && coinRAF) return;
  if (target === Math.floor(coinShown) && !coinRAF){ $('coins').textContent = fmtN(target); return; }
  coinFrom = coinShown; coinTo = target; coinT0 = Math.max(performance.now(), coinHoldUntil);
  coinDur = Math.min(1200, 350 + Math.log10(Math.abs(target - coinFrom) + 1) * 220);
  if (!coinRAF) coinRAF = requestAnimationFrame(coinTick);
}
function coinTick(now){
  if (now < coinT0){ coinRAF = requestAnimationFrame(coinTick); return; }
  const k = Math.min(1, (now - coinT0) / coinDur), e = 1 - Math.pow(1 - k, 3);
  coinShown = coinFrom + (coinTo - coinFrom) * e; $('coins').textContent = fmtN(Math.round(coinShown));
  if (k < 1) coinRAF = requestAnimationFrame(coinTick); else { coinShown = coinTo; coinRAF = null; }
}
function flyCoins(from, amount){
  if (!motion || !amount || amount <= 0) return;
  const tgt = $('coinChip').querySelector('img').getBoundingClientRect(), tx = tgt.left + tgt.width/2, ty = tgt.top + tgt.height/2;
  let fx0, fy0;
  if (from && from.getBoundingClientRect){ const r = from.getBoundingClientRect(); fx0 = r.left + r.width/2; fy0 = r.top + r.height/2; }
  else { fx0 = from.x; fy0 = from.y; }
  const n = Math.min(10, 3 + Math.floor(Math.log10(amount + 1) * 2));
  const travel = 650, stagger = 55;
  coinHoldUntil = performance.now() + travel;          // counter starts rolling when the first coin lands
  for (let i = 0; i < n; i++){
    const c = document.createElement('img'); c.src = IMGSRC.ui_coin; c.className = 'flycoin'; c.alt = '';
    document.body.appendChild(c);
    const sx = fx0 + (Math.random() - .5) * 30, sy = fy0 + (Math.random() - .5) * 20;
    const mx = (sx + tx)/2 + (Math.random() - .5) * 120, my = Math.min(sy, ty) - 60 - Math.random()*60;
    const anim = c.animate([
      { transform: `translate(${sx-11}px,${sy-11}px) scale(.6)`, opacity: 0 },
      { transform: `translate(${sx-11}px,${sy-24}px) scale(1.1)`, opacity: 1, offset: .15 },
      { transform: `translate(${mx-11}px,${my-11}px) scale(1)`, opacity: 1, offset: .55 },
      { transform: `translate(${tx-11}px,${ty-11}px) scale(.7)`, opacity: .9 }
    ], { duration: travel, delay: i * stagger, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'both' });
    anim.onfinish = () => { c.remove(); const chip = $('coinChip'); chip.classList.remove('bump'); void chip.offsetWidth; chip.classList.add('bump'); };
  }
}

/* ===== 7. day/night, cloudy weather, power, water sources, billing, weeds ===== */
const DN = CFG.dayNight, POW = CFG.power, BILL = CFG.billing, WAT = CFG.water, ELEC = CFG.electricity, DEV = CFG.devices || {};
const MIN = 60e3, HOUR = 3600e3, DAY = 86400e3;

/* ---------- location & sun ---------- */
function cityById(id){ return CFG.cities.find(c => c.id === id); }
function guessCity(){
  let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
  return CFG.cities.find(c => (c.tz || []).includes(tz)) || cityById('taipei');
}
function getLatLon(){
  const L = (S && S.settings && S.settings.location) || { mode: 'auto' };
  if ((L.mode === 'custom' || L.mode === 'geo') && isFinite(L.lat) && isFinite(L.lon)) return { lat: +L.lat, lon: +L.lon, name: L.mode === 'geo' ? '目前位置' : '自訂位置' };
  const c = (L.mode === 'city' && cityById(L.cityId)) || guessCity();
  return { lat: c.lat, lon: c.lon, name: c.name };
}
const sunCache = new Map();
function sunTimes(ms){
  const { lat, lon } = getLatLon();
  const d = new Date(ms), key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}|${lat}|${lon}`;
  if (sunCache.has(key)) return sunCache.get(key);
  const rad = Math.PI/180, J = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12) / DAY + 2440587.5;
  const n = Math.round(J - 2451545.0 + 0.0008), Js = n - lon/360;
  const M = ((357.5291 + 0.98560028*Js) % 360 + 360) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const lam = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545.0 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*lam*rad);
  const dec = Math.asin(Math.sin(lam*rad) * Math.sin(23.44*rad));
  const cw = (Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  let res;
  if (cw >= 1) res = { rise: null, set: null, polar: 'night' };
  else if (cw <= -1) res = { rise: null, set: null, polar: 'day' };
  else { const w = Math.acos(cw)/rad; const toMs = j => (j - 2440587.5) * DAY; res = { rise: toMs(Jt - w/360), set: toMs(Jt + w/360) }; }
  if (sunCache.size > 60) sunCache.clear();
  sunCache.set(key, res); return res;
}
// phase: dawn | day | dusk | night ; light 0 (night) .. 1 (day)
function dayPhase(ms){
  const s = sunTimes(ms), tw = DN.twilightMinutes * MIN;
  if (s.polar) return { phase: s.polar === 'day' ? 'day' : 'night', light: s.polar === 'day' ? 1 : 0, sun: s };
  if (ms < s.rise - tw || ms > s.set + tw) return { phase: 'night', light: 0, sun: s };
  if (ms < s.rise + tw) return { phase: 'dawn', light: (ms - (s.rise - tw)) / (2*tw), sun: s };
  if (ms > s.set - tw) return { phase: 'dusk', light: 1 - (ms - (s.set - tw)) / (2*tw), sun: s };
  return { phase: 'day', light: 1, sun: s };
}
const isNightAt = ms => dayPhase(ms).phase === 'night';
function seasonAt(ms){ const m = new Date(ms).getMonth() + 1, south = getLatLon().lat < 0;
  return (south ? CFG.seasons.south : CFG.seasons.north).summerMonths.includes(m) ? 'summer' : 'winter'; }
function elecPrice(ms){ const p = ELEC.pricePerKwh[seasonAt(ms)]; return isNightAt(ms) ? p.night : p.day; }

/* ---------- cloudy (shared like rain) ---------- */
function slotCloudy(slot){ if (slotRain(slot)) return true; return h32(slot*104723 + W.version*7 + 77) < (W.cloudyChancePerSlot || 0); }
const cloudyAt = ms => slotCloudy(slotOf(ms));

/* ---------- local clock helpers ---------- */
function localMidnight(ms){ const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function hhmmToMin(s){ const [h,m] = String(s || '0:0').split(':').map(Number); return (h||0)*60 + (m||0); }
function minuteOfDay(ms){ const d = new Date(ms); return d.getHours()*60 + d.getMinutes(); }
const fmtHM = ms => { const d = new Date(ms); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

/* ---------- utilities state ---------- */
const utilCut = () => S.player.coins < 0;
const gridOn = () => !!S.settings.grid && !utilCut();
const tapOn = () => !!S.settings.tapWater && !utilCut();
function rainCap(){
  let b = 0;
  for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'deco'){ const e = CFG.decos[T.id].effect; if (e && e.type === 'storage') b += e.value; } }
  return (lvInfo(S.player.level).rainStorage || 500) + b;
}
let rainCapCache = { ver: -1, v: 500, lvl: 0 };
function rainCapC(){ if (rainCapCache.ver !== RT.decoVer || rainCapCache.lvl !== S.player.level) rainCapCache = { ver: RT.decoVer, lvl: S.player.level, v: rainCap() }; return rainCapCache.v; }
function wellsPerHour(){ let n = 0; for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'deco' && CFG.decos[T.id].effect && CFG.decos[T.id].effect.groundwaterPerHour) n += CFG.decos[T.id].effect.groundwaterPerHour; } return n; }
// take n drops: rain storage first, then tap water (metered). returns true if fully paid.
function useWater(n, dry, t = Date.now()){
  const fromRain = Math.min(S.player.water, n), rest = n - fromRain;
  if (rest > 1e-9 && !tapOn()) return false;
  if (!dry){ S.player.water -= fromRain; if (rest > 0) tapMeter(rest, t); }
  return true;
}

/* ---------- devices ---------- */
const isDevice = T => T && T.t === 'device';
function lampOnWanted(T, ms){
  if (T.mode === 'manual') return !!T.on;
  if (T.mode === 'auto') return isNightAt(ms);
  if (T.mode === 'schedule'){ const a = hhmmToMin(T.from), b = hhmmToMin(T.to), m = minuteOfDay(ms); return a <= b ? (m >= a && m < b) : (m >= a || m < b); }
  return false;
}
function allDevices(){ const out = []; S.maps.forEach((M,mi) => { for (const k in M.tiles){ const T = M.tiles[k]; if (isDevice(T)) out.push({ T, M, mi, k }); } }); return out; }
function batteryCap(){ return allDevices().filter(d => DEV[d.T.id].kind === 'battery').reduce((a,d) => a + DEV[d.T.id].capacityKwh, 0); }
function batteryRate(){ return allDevices().filter(d => DEV[d.T.id].kind === 'battery').reduce((a,d) => a + DEV[d.T.id].maxRateKwhPerHour, 0); }
function crankCap(){ return allDevices().filter(d => DEV[d.T.id].kind === 'crank').reduce((a,d) => a + DEV[d.T.id].bufferKwh, 0); }
const litTiles = {};   // per map: Set of tile keys lit during the last step
function stepPower(dt, t){
  const P = S.power, devs = allDevices(), h = dt/3600;
  const lamps = devs.filter(d => DEV[d.T.id].kind === 'lamp'), gens = devs.filter(d => DEV[d.T.id].kind === 'generator');
  const bCap = batteryCap(), bRate = batteryRate() * h, cCap = crankCap();
  P.battery = Math.min(P.battery, bCap); P.crank = Math.min(P.crank, cCap);
  // generator output this step
  let gen = 0;
  for (const g of gens){ const run = Math.min(g.T.fuel || 0, DEV[g.T.id].kwhPerHour * h); g.T.fuel = (g.T.fuel || 0) - run; g.T.running = run > 0; gen += run; }
  // lamp demand
  const want = lamps.filter(d => lampOnWanted(d.T, t)), demand = want.reduce((a,d) => a + DEV[d.T.id].kwhPerHour * h, 0);
  const order = POW.priorityOrder[S.settings.powerPriority === 'grid' ? 'grid' : 'battery'];
  const price = elecPrice(t), night = isNightAt(t);
  const avail = { battery: Math.min(P.battery, bRate), crankBuffer: P.crank, generator: gen, grid: gridOn() ? Infinity : 0 };
  const powered = demand <= 1e-12 || order.reduce((a,src) => a + avail[src], 0) >= demand - 1e-12;
  let batOut = 0;
  if (powered && demand > 0){
    let need = demand;
    for (const src of order){
      if (need <= 1e-12) break;
      const n = Math.min(need, avail[src]); if (n <= 0) continue;
      if (src === 'battery'){ P.battery -= n; batOut += n; }
      else if (src === 'crankBuffer') P.crank -= n;
      else if (src === 'generator') gen -= n;
      else if (src === 'grid'){ S.bill.cur.elecKwh[night ? 'night' : 'day'] += n; S.bill.cur.elecCost += n * price; }
      need -= n;
    }
  }
  for (const d of lamps) d.T.lit = powered && demand > 0 && want.includes(d);
  // leftover generator power charges batteries, then is wasted
  let room = Math.max(0, bCap - P.battery), rateLeft = Math.max(0, bRate - batOut);
  if (gen > 0 && room > 0){ const n = Math.min(gen, rateLeft, room / POW.batteryEfficiency); P.battery += n * POW.batteryEfficiency; rateLeft -= n; room = bCap - P.battery; }
  // grid charging of batteries
  const gc = S.settings.batteryGridCharge;
  if (gridOn() && room > 1e-9 && rateLeft > 0 && (gc === 'always' || (gc === 'night' && night))){
    const n = Math.min(rateLeft, room / POW.batteryEfficiency);
    P.battery += n * POW.batteryEfficiency; S.bill.cur.elecKwh[night ? 'night' : 'day'] += n; S.bill.cur.elecCost += n * price;
  }
  // lit tiles per map
  for (const k in litTiles) delete litTiles[k];
  for (const d of lamps) if (d.T.lit){ const r = DEV[d.T.id].range, [x0,y0] = pkey(d.k), set = litTiles[d.mi] || (litTiles[d.mi] = new Set());
    for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++) set.add(tkey(x0+dx, y0+dy)); }
  // base fees accrue while connected and not cut
  if (gridOn()) S.bill.cur.gridDays += dt/86400;
}
// growth multiplier from time of day / clouds for a tile
function envRate(mi, k, t){
  const ph = dayPhase(t).phase, lit = litTiles[mi] && litTiles[mi].has(k);
  if (ph === 'night') return lit ? 1 : DN.nightGrowthRate;
  if (farmCloudy(t)) return lit ? 1 : DN.cloudyDayGrowthRate;
  return 1;
}

/* ---------- billing ---------- */
function newBillPeriod(start){ return { start, elecKwh: { day: 0, night: 0 }, elecCost: 0, water: 0, gridDays: 0, tapDays: 0, flowDays: [] }; }
function cycleDef(){ return BILL.cycles[S.bill.cycle] || BILL.cycles.d7; }
function cycleDays(){ const c = cycleDef(); return c.hours ? c.hours/24 : c.days; }
function nextClose(){
  const c = cycleDef(), start = S.bill.cur.start;
  if (c.hours){ // close at the listed local times
    const base = localMidnight(start); let best = null;
    for (let dd = 0; dd <= 1; dd++) for (const s of c.closeAt){ const tt = base + dd*DAY + hhmmToMin(s)*MIN + 59e3; if (tt > start + MIN && (best === null || tt < best)) best = tt; }
    return best;
  }
  let close = S.bill.anchor + c.days*DAY - 1e3;
  while (close <= start + MIN) close += c.days*DAY;
  return close;
}
function waterCharge(drops, days){
  let left = drops, prev = 0, cost = 0;
  for (const tier of WAT.tapTiersPerDay){ const cap = tier.upTo === null ? Infinity : tier.upTo * days; const n = Math.max(0, Math.min(left, cap - prev)); cost += n * tier.price; left -= n; prev = cap; if (left <= 0) break; }
  return cost;
}
function computeBill(cur, days){
  const elec = cur.elecCost, elecBase = cur.gridDays * ELEC.baseFeePerDay, water = waterCharge(cur.water, days), waterBase = ((cur.tapDays || 0) + (cur.flowDays ? cur.flowDays.length : 0)) * WAT.baseFeePerDay;
  return { elec, elecBase, water, waterBase, total: Math.round(elec + elecBase + water + waterBase) };
}
function closeBill(t, reason){
  const cur = S.bill.cur, days = cycleDays(), c = computeBill(cur, days);
  const dueMs = Math.min(BILL.dueMaxDays*DAY, days*DAY*BILL.dueFractionOfCycle);
  if (c.total > 0){
    const b = { id: 'b' + t.toString(36), from: cur.start, to: t, issuedAt: t, dueAt: t + dueMs, kwhDay: cur.elecKwh.day, kwhNight: cur.elecKwh.night, water: cur.water, ...c, paid: 0, paidAt: 0, status: 'unpaid' };
    if (S.settings.autoPay){ b.paid = Math.round(c.total * BILL.autoPayRate); b.paidAt = t; b.status = 'auto'; S.player.coins -= b.paid; }
    S.bill.list.unshift(b); S.bill.list = S.bill.list.slice(0, 40);
    RT.notices.push({ kind: 'bill', bill: b });
  }
  S.bill.cur = newBillPeriod(t);
}
function billRate(b, t){
  if (t <= b.issuedAt + HOUR) return 0.95;
  if (t <= b.issuedAt + (b.dueAt - b.issuedAt) * 0.5) return 0.98;
  if (t <= b.dueAt) return 1;
  return 1 + BILL.lateFeeRate;
}
function payBill(b, t = Date.now()){
  if (b.status !== 'unpaid') return 0;
  b.paid = Math.round(b.total * billRate(b, t)); b.paidAt = t; b.status = t > b.dueAt ? 'late' : 'paid';
  S.player.coins -= b.paid; return b.paid;
}
function stepBilling(t){
  let guard = 0;
  while (t >= nextClose() && guard++ < 400) closeBill(nextClose(), 'cycle');
  for (const b of S.bill.list) if (b.status === 'unpaid' && t > b.dueAt){ payBill(b, t); RT.notices.push({ kind: 'billLate', bill: b }); }
}
function changeCycle(id){
  if (id === S.bill.cycle) return;
  closeBill(Date.now(), 'switch');
  S.bill.cycle = id; S.bill.anchor = localMidnight(Date.now()); S.bill.cur = newBillPeriod(Date.now());
}

/* ---------- weeds ---------- */
const WEED = CFG.weeds;
function stepWeeds(t){
  S.maps.forEach((M) => {
    M.weedClock = M.weedClock || {};
    for (const [bx,by] of M.blocks){
      const bk = bx + ',' + by; if (!M.weedClock[bk]) M.weedClock[bk] = t;
      const period = WEED.minutesPerWeedPerBlock * MIN;
      while (t - M.weedClock[bk] >= period){
        M.weedClock[bk] += period;
        let n = 0, free = [];
        for (let y=by*BS; y<by*BS+BS; y++) for (let x=bx*BS; x<bx*BS+BS; x++){ const T = M.tiles[tkey(x,y)]; if (T && T.t === 'weed') n++; else if (!T) free.push(tkey(x,y)); }
        if (n >= WEED.maxPerBlock){ M.weedClock[bk] = t; break; }
        if (free.length){ const k = free[Math.floor(Math.random()*free.length)]; M.tiles[k] = { t: 'weed', v: Math.floor(Math.random()*3) }; }
      }
    }
  });
}
function pullWeed(M, k, cx, cy){
  if (invFree() >= 1){ invAdd(WEED.item, 1); floatText(cx, cy - 18, '雜草 +1 進倉庫', '#2f6a3a', 11); }
  else { S.player.coins += WEED.fullStorageCoins; flyCoins(worldToScreen(cx, cy - 10), WEED.fullStorageCoins); floatText(cx, cy - 18, `倉庫滿了，直接換 +${WEED.fullStorageCoins}`, '#c98a0c', 11); }
  delete M.tiles[k];
}

/* ---------- per-step world update (called from stepAll) ---------- */
function stepWorld(dt, t, rainNow){
  // groundwater from wells into the tower, then tap water up to the fill line
  const wph = wellsPerHour(); if (wph && S.player.water < rainCapC()) S.player.water = Math.min(rainCapC(), S.player.water + wph * dt/3600);
  stepTap(dt, t, rainNow);
  if (RT.towerMissing && (!RT.towerTry || t - RT.towerTry > 60e3)){ RT.towerTry = t; RT.towerMissing = !ensureTower(S); }
  stepPower(dt, t);
  stepWeeds(t);
}
function stepDrone(dt, t = Date.now()){
  // drone keeps soils/trees at full moisture, paying 1 drop per restored level (rain first, then tap)
  let need = 0; const targets = [];
  for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if ((T.t === 'soil' || T.t === 'tree') && T.m < R.moistMaxLevel){ need += (R.moistMaxLevel - T.m) * (WAT.droneDropsPerLevel || 1); targets.push(T); } }
  if (!targets.length) return true;
  if (!useWater(need, false, t)) return false;
  for (const T of targets){ T.m = R.moistMaxLevel; T.dry = 0; if (T.crop) T.crop.wither = false; }
  return true;
}
function normalizeWorld(d){
  const sd = CFG.settingsDefaults || {};
  d.settings = Object.assign({ animation: sd.animation || 'system', location: { mode: 'auto' }, tapWater: !!sd.tapWater, grid: !!sd.grid, billingCycle: sd.billingCycle || 'd7',
    autoPay: sd.autoPay !== false, powerPriority: sd.powerPriority || 'battery', batteryGridCharge: sd.batteryGridCharge || 'night' }, d.settings || {});
  if (typeof d.settings.location !== 'object') d.settings.location = { mode: 'auto' };
  d.power = Object.assign({ battery: 0, crank: 0 }, d.power || {});
  if (!d.bill){ const now = Date.now(); d.bill = { cycle: d.settings.billingCycle, anchor: localMidnight(now), cur: newBillPeriod(now), list: [] }; }
  for (const M of d.maps) M.weedClock = M.weedClock || {};
  normalizeV14(d);
  return d;
}

function lampCoverage(M, k, T){ const r = DEV[T.id].range, [x0,y0] = pkey(k); let n = 0;
  for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){ const U = M.tiles[tkey(x0+dx,y0+dy)]; if (U && ((U.t === 'soil' && U.crop) || U.t === 'tree')) n++; } return n; }
function lampTonightHours(T){
  const now = Date.now(); let h = 0;

}

const TOWER = WAT.tower || { tile: [2,0], tapFlowPerSecond: 10, fillLines: [null,0.3,0.5,0.8,1], defaultFillLine: 0.5 };

/* ---------- water tower ---------- */
function ensureTower(d){
  if (d.buildStore && d.buildStore.water_tower > 0) return true;
  for (const M of d.maps) for (const k in M.tiles) if (M.tiles[k] && M.tiles[k].t === 'tower') return true;
  const M = d.maps[0]; if (!M) return false;
  const [tx,ty] = TOWER.tile; let best = null, bd = Infinity;
  for (const [bx,by] of M.blocks) for (let y=by*BS; y<by*BS+BS; y++) for (let x=bx*BS; x<bx*BS+BS; x++){
    const T = M.tiles[tkey(x,y)]; if (T && T.t !== 'weed') continue;
    const dist = (x === tx && y === ty) ? -1 : Math.max(Math.abs(x - 1), Math.abs(y - 1)) * 10 + Math.abs(x - tx) + Math.abs(y - ty);
    if (dist < bd){ bd = dist; best = tkey(x,y); }
  }
  if (!best) return false;
  M.tiles[best] = { t: 'tower' };
  return true;
}
function towerPos(){ for (let mi = 0; mi < S.maps.length; mi++){ const M = S.maps[mi]; for (const k in M.tiles) if (M.tiles[k].t === 'tower') return { mi, k }; } return null; }
const fillLine = () => S.settings.tapFillLine === undefined ? TOWER.defaultFillLine : S.settings.tapFillLine;
function fillLineName(v){ return v == null ? '不自動補' : `${Math.round(v*100)}%`; }
function dayKey(ms){ const d = new Date(ms); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
// record metered tap water
function tapMeter(n, t){
  if (!(n > 0)) return;
  const cur = S.bill.cur; cur.water += n;
  if (!cur.flowDays) cur.flowDays = [];
  const dk = dayKey(t); if (!cur.flowDays.includes(dk)) cur.flowDays.push(dk);
  S.lastFlow = Math.max(S.lastFlow || 0, t);
}
function meterState(now = Date.now()){ if (!tapOn()) return 'off'; return !farmRain(now) && now - (S.lastFlow || 0) < 2500 ? 'flow' : 'idle'; }
const METER_TEXT = { off: '未接水', idle: '停止（不計費）', flow: '注水中' };
function stepTap(dt, t, rainNow){
  if (rainNow || !tapOn()) return;
  const line = fillLine(); if (line == null) return;
  const target = rainCapC() * line, P = S.player;
  if (P.water < target - 1e-6){ const add = Math.min(target - P.water, (TOWER.tapFlowPerSecond || 10) * dt); P.water += add; tapMeter(add, t); }
}
function capBreakdown(){
  const rows = [['等級基本儲量', lvInfo(S.player.level).rainStorage || 500]], seen = {};

    if (e && e.type === 'storage'){ seen[T.id] = (seen[T.id] || 0) + 1; } }
  for (const [id,n] of Object.entries(seen)) rows.push([`${CFG.decos[id].name}${n > 1 ? ' × ' + n : ''}`, CFG.decos[id].effect.value * n]);
  return rows;
}

/* ---------- storage buildings ---------- */
function bldSize(id){ return (BLD[id] && BLD[id].size) || [1,1]; }
function placedBuilding(id){ for (const M of S.maps) for (const k in M.tiles){ const T = M.tiles[k]; if (T.t === 'building' && T.id === id) return true; } return false; }
function placeBuilding(M, x, y, id, cx, cy){
  if (!(S.buildStore[id] > 0)){ toast(`${BLD[id].name}已經放在農場上了`); return false; }
  const [w,h] = bldSize(id), cells = [];
  for (let dy=0; dy<h; dy++) for (let dx=0; dx<w; dx++){ const xx = x+dx, yy = y+dy;
    if (!inMap(M, xx, yy) || M.tiles[tkey(xx,yy)]){ toast(`${BLD[id].name}要 ${w}×${h} 格空草地（從點的格子往右下）`); return false; } cells.push(tkey(xx,yy)); }
  for (const k of cells) M.tiles[k] = { t: 'building', id, rx: x, ry: y };
  S.buildStore[id]--; floatText(cx, cy - 24, `放好${BLD[id].name}`, '#2f7fa8', 11); return true;
}
function storeBuilding(M, T){
  const [w,h] = bldSize(T.id);
  for (let dy=0; dy<h; dy++) for (let dx=0; dx<w; dx++) delete M.tiles[tkey(T.rx+dx, T.ry+dy)];
  S.buildStore[T.id] = (S.buildStore[T.id] || 0) + 1; toast(`${BLD[T.id].name}收回飾品倉庫了，可以再拿出來擺`);
}
function drawBuildingAt(T, x, y, t){

/* ---------- weather dolls ---------- */
const dollById = id => S.dolls.find(d => d.id === id);

// main entry from the deco tool. sel = 'dollbuy:type:size' | 'dollown:type:size' | 'dollown:type:spent'
